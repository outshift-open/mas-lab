experiment:
  name: smoke-design-space-topologies
  description: >
    CI smoke for design-space.lab Exp 1.2 — one run, level-scoped
    eval/gather pipeline, isolated trace cache (cache disabled).
  default_flavour: local
  applications:
    - app: trip-planner
      configs_dir: ../../../labs/design-space.lab/02-topologies/overlays
  scenarios:
    - id: topo-linear-pipeline
      overlays:
        logic: []
        control: []
        infra: []
  dataset:
    name: trip-planner-benchmark-100
    locator: samples
    limit: 1
  execution:
    emulation:
      runtime:
        cache: disabled
  run:
    n_runs: 1
    artifacts:
      trace:
        type: trace
        path: "{run_dir}/traces/events.jsonl"
      metrics: metrics
      df:
        type: dataframe
        path: "{level_dir}/data.csv"
    post:
      - name: eval-quality
        type: eval_mce
        in: trace
        out: metrics
        config:
          overwrite: true
          metrics:
            - goal_success_rate
            - answer_relevancy
      - name: run-df
        type: metrics_to_dataframe
        in: metrics
        out: df
        depends_on: [eval-quality]
  test:
    artifacts:
      df:
        type: dataframe
        path: "{level_dir}/data.csv"
    post:
      - name: gather-test
        type: gather_level
        in: df
        out: df
        depends_on: [run-df]
        config:
          output: data.csv
  scenario:
    artifacts:
      df:
        type: dataframe
        path: "{level_dir}/data.csv"
    post:
      - name: gather-scenario
        type: gather_level
        in: df
        out: df
        depends_on: [gather-test]
        config:
          output: data.csv
  application:
    artifacts:
      df:
        type: dataframe
        path: "{level_dir}/data.csv"
    post:
      - name: gather-experiment
        type: gather_level
        in: df
        out: df
        depends_on: [gather-scenario]
        config:
          output: data.csv
      - name: compute-ci
        type: compute_ci
        depends_on: [gather-experiment]
        config:
          data: "@gather-experiment"
          groupby: [scenario, metric]
          metrics: [answer_relevancy, goal_success_rate]
          extra_cols: [latency_s]
          ci_method: t
          ci_level: 0.95
          output: "{output_dir}/results/ci_summary.csv"
