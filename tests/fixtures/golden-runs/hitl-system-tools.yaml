# Golden captures were recorded when request_human_input / inform_user were
# exposed by default; declaring them keeps the replayed LLM requests identical.
apiVersion: mas/v1
kind: Overlay
metadata:
  name: hitl-system-tools
spec:
  target:
    kind: Agent
  patch:
    tools:
      $op:
        add:
          - kind: system
            name: request_human_input
          - kind: system
            name: inform_user
