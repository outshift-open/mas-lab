# IoC challenge reproduction heatmap — RELATIVE (% change) variant. Same data as
# ioc_reproduction_heatmap, but each cell is the percent change in failure rate vs the
# baseline ((overlay − baseline) / baseline), matching the blog's eval_metrics diff view.
# Use alongside the absolute-delta heatmap: absolute shows magnitude, this shows relative
# swing (a small-baseline metric that doubles reads +100% here but only a few points there).
plot:
  name: ioc_reproduction_heatmap_pct
  type: heatmap
  title: "IoC reproduction — % change in failure rate vs baseline, per challenge × metric"
  subtitle: ""
  description: >
    Per (challenge × cognitive metric): the RELATIVE change in LLM-judge failure rate
    between the challenge overlay and the no-overlay baseline, as a percent of the baseline
    rate. Positive (green) = the overlay fails the metric more than baseline; 0 (pale) = no
    change; negative (red) = fewer failures than baseline. Cells are clipped to ±100%.

  data:
    key: ablation_matrix          # list[{challenge, dimension, delta, pct_delta}]
    x: dimension                  # columns = cognitive metric
    y: challenge                  # rows = challenge
    value: pct_delta              # cell = (overlay − baseline) / baseline  (fraction)

  marks:
    - type: heatmap_cell
      annotate: true
      annotation_format: "+.0%"     # fraction → whole percent
      annotation_fontsize: 9

  scales:
    color:
      type: diverging
      palette: RdYlGn             # green = more failures (reproduced), red = fewer
      domain: [-1, 1]            # ±100% relative change; larger swings clip to the ends
      center: 0
    x:
      label: "Cognitive metric"
    y:
      label: "Challenge"
      sort_by: challenge_id

  aesthetics:
    linewidth: 0.6
    linecolor: "#ffffff"

  layout:
    width:  1100
    height: 420
    colorbar: true
    colorbar_percent: true
    colorbar_label: "% change in failure rate vs baseline (overlay − baseline) / baseline"
    margin: {left: 150, right: 90, top: 60, bottom: 150}

  output:
    format: svg
    dpi: 150
