$schema: "http://json-schema.org/draft-07/schema#"
$id: "urn:mas-lab:fragments:memory-seed-entry:v1"
title: Memory seed entry
description: >
  One pre-loaded memory document. Dataset items, experiment defaults, and
  overlay ``memory_seed`` all use this shape. A MemorySeed kind file uses
  ``key`` instead of ``source``; the loader accepts both.
type: object
required: [content]
additionalProperties: true
properties:
  source:
    type: string
    description: Provenance label (not a file path).
  key:
    type: string
    description: MemorySeed kind alias for source.
  content:
    type: string
  target_agent:
    type: string
  metadata:
    type: object
    additionalProperties: true
