$schema: "http://json-schema.org/draft-07/schema#"
$id: "urn:mas-lab:fragments:tool-fixture-mapping:v1"
title: Tool fixture mapping
description: >
  Generic mas-lab layer: bind a payload to this item and to tools.
  The YAML body those files contain is tool-specific and is not
  schema-checked here.
oneOf:
  - $ref: "urn:mas-lab:fragments:ref:v1"
  - type: string
    minLength: 1
    description: "Shorthand for a {ref} object whose ref is this string."
  - type: object
    additionalProperties: false
    required: [by_tool]
    properties:
      by_tool:
        type: object
        minProperties: 1
        additionalProperties:
          description: Path, {ref}, or inline tool payload (free-form, owned by the tool).
          anyOf:
            - $ref: "urn:mas-lab:fragments:ref:v1"
            - type: string
              minLength: 1
            - type: object
              additionalProperties: true
            - type: array
  - type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [ref]
      properties:
        tool:
          type: string
        tools:
          type: array
          items:
            type: string
        ref:
          type: string
          minLength: 1
