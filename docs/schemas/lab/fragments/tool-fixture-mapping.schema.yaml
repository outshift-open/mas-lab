$schema: "http://json-schema.org/draft-07/schema#"
$id: "urn:mas-lab:fragments:tool-fixture-mapping:v1"
title: Tool fixture mapping
description: >
  Generic mas-lab layer: bind a payload to this item and to tools.
  The YAML body those files contain is tool-specific and is not
  schema-checked here.
oneOf:
  - $ref: "urn:mas-lab:fragments:ref:v1"
  - type: string
    minLength: 1
    description: "Shorthand for a {ref} object whose ref is this string."
  - type: object
    deprecated: true
    description: >
      DEPRECATED. SRE-era incident_fixture alias. Use {ref:} or by_tool.
      See https://outshift-open.github.io/mas-lab/manifests/dataset-migration/
    additionalProperties: true
    required: [incident_fixture]
    properties:
      incident_fixture:
        type: string
        minLength: 1
  - type: object
    additionalProperties: false
    required: [by_tool]
    properties:
      by_tool:
        type: object
        minProperties: 1
        additionalProperties:
          description: Path, {ref}, {data} alias, or inline tool payload (opaque).
          oneOf:
            - $ref: "urn:mas-lab:fragments:ref:v1"
            - type: string
              minLength: 1
            - type: object
              additionalProperties: true
            - type: array
  - type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      anyOf:
        - required: [ref]
        - required: [data]
      properties:
        tool:
          type: string
        tools:
          type: array
          items:
            type: string
        ref:
          type: string
          minLength: 1
        data:
          type: string
          description: Alias for ref.
