$schema: "http://json-schema.org/draft-07/schema#"
$id: "urn:mas-lab:fragments:message:v1"
title: Conversation message
description: One turn in user / HITL / system dialogue.
type: object
required: [role, content]
additionalProperties: false
properties:
  role:
    type: string
    enum: [user, hitl, system]
  content:
    type: string
    minLength: 1
