# Overlay — bound hidden thinking; CoT stays out of working memory.
apiVersion: mas/v1
kind: Overlay
metadata:
  name: llm-reasoning
spec:
  target:
    kind: Agent
  patch:
    models:
      - id: main
        reasoning:
          effort: low
          budget_tokens: 512
          exclude: true
          think: true
