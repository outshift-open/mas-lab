# Overlay — static sampling overset + extra passthrough on spec.models[].
apiVersion: mas/v1
kind: Overlay
metadata:
  name: llm-sampling
spec:
  target:
    kind: Agent
  patch:
    models:
      - id: main
        temperature: 0.2
        top_p: 0.9
        top_k: 40
        min_p: 0.05
        repetition_penalty: 1.05
        seed: 7
        verbosity: low
        extra:
          guided_json:
            type: object
            properties:
              answer:
                type: string
