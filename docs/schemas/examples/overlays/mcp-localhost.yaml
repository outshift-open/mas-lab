# Example overlay — MCP provider on localhost (canonical copy:
# library-samples/overlays/mcp-localhost.yaml).
apiVersion: mas/v1
kind: Overlay
metadata:
  name: mcp-localhost
spec:
  target:
    kind: Agent
  patch:
    providers:
      - name: localhost-mcp-tools
        kind: mcp
        transport: streamable-http
        url: http://127.0.0.1:9001/mcp
        tools: "*"
