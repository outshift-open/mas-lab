$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#execution-binding"
title: ExecutionBinding
description: EngineContract execution mode — mock/live/cache/parallel only.
type: object
additionalProperties: false
properties:
  mocking:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
  cache:
    type: object
    additionalProperties: false
    properties:
      enabled:
        type: boolean
        description: >
          Master on/off switch. false disables both read and write outright,
          regardless of the read/write fields below. Omit (or true) to let
          read/write each control their own default independently.
      read:
        type: boolean
        description: "Look up a cached response before calling the LLM. Default: true."
      write:
        type: boolean
        description: "Persist a response to the cache after calling the LLM. Default: true."
  parallel:
    type: boolean
  live:
    type: boolean
  stream:
    type: boolean
    description: >
      Stream the LLM response over SSE instead of waiting for the full
      completion, forwarding content deltas to ctx.on_stream_chunk as they
      arrive. Default: false.
  timeout:
    type: number
    minimum: 0
