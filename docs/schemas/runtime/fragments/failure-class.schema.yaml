$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#failure-class"
title: FailureClass
description: >
  Typed failure independent of transport. Infra retry, the circuit breaker,
  and ingress error_policy all key off these names.
type: string
enum:
  - transient
  - unavailable
  - application
  - fatal
