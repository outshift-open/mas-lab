$schema: "https://json-schema.org/draft-07/schema#"
title: OverlayGovernanceCollectionOps
oneOf:
  - $ref: "./governance-binding.schema.yaml"
  - type: object
    additionalProperties: false
    required: [$op]
    properties:
      $op:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          replace:
            $ref: "./governance-binding.schema.yaml"
          add:
            $ref: "./governance-binding.schema.yaml"
          remove:
            type: array
            items:
              type: string
          clear:
            type: boolean
            const: true