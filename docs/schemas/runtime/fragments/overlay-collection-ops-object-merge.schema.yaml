$schema: "https://json-schema.org/draft-07/schema#"
title: OverlayObjectMergeOps
oneOf:
  - type: object
  - type: object
    additionalProperties: false
    required: [$op]
    properties:
      $op:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          replace:
            type: object
          merge:
            type: object
          clear:
            type: boolean
            const: true
