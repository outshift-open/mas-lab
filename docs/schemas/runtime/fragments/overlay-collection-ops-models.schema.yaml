$schema: "https://json-schema.org/draft-07/schema#"
title: OverlayModelCollectionOps
description: >
  Overlay patch for spec.models[]. Raw list merges by id (then model, then
  ``main``). ``$op`` add/remove/replace/clear uses the same keys.
oneOf:
  - type: array
    items:
      $ref: "./llm-model-entry.schema.yaml"
  - type: object
    additionalProperties: false
    required: [$op]
    properties:
      $op:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          replace:
            type: array
            items:
              $ref: "./llm-model-entry.schema.yaml"
          add:
            type: array
            items:
              $ref: "./llm-model-entry.schema.yaml"
          remove:
            type: array
            items:
              oneOf:
                - type: string
                - $ref: "./llm-model-entry.schema.yaml"
          clear:
            type: boolean
            const: true
