$schema: "https://json-schema.org/draft-07/schema#"
title: OverlayToolCollectionOps
# Item shapes are inlined (no #/definitions $ref): this fragment is $ref'd
# into overlay.schema.yaml, and jsonschema resolves # against that parent.
oneOf:
  - type: array
    items:
      oneOf:
        - type: string
        - type: object
          additionalProperties: false
          required: [ref]
          properties:
            ref:
              type: string
            params:
              type: object
              additionalProperties: true
        - type: object
          additionalProperties: false
          required: [kind, name]
          properties:
            kind:
              type: string
              const: system
            name:
              type: string
              enum: [request_human_input, inform_user, activate_skill, run_skill_script]
            params:
              type: object
              additionalProperties: true
  - type: object
    additionalProperties: false
    required: [$op]
    properties:
      $op:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          replace:
            type: array
            items:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: false
                  required: [ref]
                  properties:
                    ref:
                      type: string
                    params:
                      type: object
                      additionalProperties: true
                - type: object
                  additionalProperties: false
                  required: [kind, name]
                  properties:
                    kind:
                      type: string
                      const: system
                    name:
                      type: string
                      enum: [request_human_input, inform_user, activate_skill, run_skill_script]
                    params:
                      type: object
                      additionalProperties: true
          add:
            type: array
            items:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: false
                  required: [ref]
                  properties:
                    ref:
                      type: string
                    params:
                      type: object
                      additionalProperties: true
                - type: object
                  additionalProperties: false
                  required: [kind, name]
                  properties:
                    kind:
                      type: string
                      const: system
                    name:
                      type: string
                      enum: [request_human_input, inform_user, activate_skill, run_skill_script]
                    params:
                      type: object
                      additionalProperties: true
          remove:
            type: array
            items:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: false
                  required: [ref]
                  properties:
                    ref:
                      type: string
          clear:
            type: boolean
            const: true
