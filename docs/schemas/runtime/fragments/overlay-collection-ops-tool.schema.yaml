$schema: "https://json-schema.org/draft-07/schema#"
title: OverlayToolCollectionOps
oneOf:
  - type: array
    items:
      oneOf:
        - type: string
        - type: object
          additionalProperties: false
          required: [ref]
          properties:
            ref:
              type: string
  - type: object
    additionalProperties: false
    required: [$op]
    properties:
      $op:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          replace:
            type: array
            items:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: false
                  required: [ref]
                  properties:
                    ref:
                      type: string
                    params:
                      type: object
                      additionalProperties: true
          add:
            type: array
            items:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: false
                  required: [ref]
                  properties:
                    ref:
                      type: string
                    params:
                      type: object
                      additionalProperties: true
          remove:
            type: array
            items:
              oneOf:
                - type: string
                - type: object
                  additionalProperties: false
                  required: [ref]
                  properties:
                    ref:
                      type: string
          clear:
            type: boolean
            const: true
