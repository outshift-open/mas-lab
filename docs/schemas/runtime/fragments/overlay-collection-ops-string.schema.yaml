$schema: "https://json-schema.org/draft-07/schema#"
title: OverlayStringCollectionOps
description: Explicit collection operations for string lists in overlays.
oneOf:
  - type: array
    items:
      type: string
  - type: object
    additionalProperties: false
    required: [$op]
    properties:
      $op:
        type: object
        additionalProperties: false
        minProperties: 1
        properties:
          replace:
            type: array
            items:
              type: string
          add:
            type: array
            items:
              type: string
          remove:
            type: array
            items:
              type: string
          clear:
            type: boolean
            const: true
