$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#context-manager-assembly-params"
title: ContextManagerAssemblyParams
description: >
  Assembly knobs under spec.context_manager.params. Read by the
  assembler / working-memory slicing — not forwarded to
  ContextManagerContract constructors (stripped in CMFactory).
type: object
additionalProperties: false
properties:
  working_memory_messages:
    type: integer
    minimum: 1
    default: 20
    description: Max in-turn working-memory messages kept for LLM assembly (tool groups atomic).
  max_in_turn_messages:
    type: integer
    minimum: 1
    description: Alias for working_memory_messages.
  trimmer:
    type: object
    description: >
      Assembly-time token trim (tool-group-aware). When omitted, max_tokens
      is the model's context_window and reserve_tokens is models[].max_tokens
      (completion). Not a registry plugin — tunable assembly params only.
    additionalProperties: false
    properties:
      max_tokens:
        type: integer
        minimum: 1
        description: >
          Max estimated input tokens after assembly. Defaults to the primary
          model's context_window.
      token_budget:
        type: integer
        minimum: 1
        description: Alias for max_tokens.
      reserve_tokens:
        type: integer
        minimum: 0
        default: 512
        description: >
          Tokens reserved for the completion (and other non-history payload).
          Defaults to the primary model's max_tokens when that is set.
  working_memory_ref:
    type: string
    description: Registry ref for working_memory context source plugin.
