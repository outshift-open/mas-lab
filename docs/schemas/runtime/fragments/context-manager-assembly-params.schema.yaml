$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#context-manager-assembly-params"
title: ContextManagerAssemblyParams
description: >
  Kernel assembly knobs under spec.context_manager.params. Read by
  assemble_llm_messages / working-memory slicing — not forwarded to
  ContextManagerContract constructors (stripped in CMFactory).
type: object
additionalProperties: false
properties:
  working_memory_messages:
    type: integer
    minimum: 1
    default: 20
    description: Max in-turn working-memory messages kept for LLM assembly (tool groups atomic).
  max_in_turn_messages:
    type: integer
    minimum: 1
    description: Alias for working_memory_messages.
  trimmer:
    type: object
    description: >
      When present with max_tokens, enables assembly-time token trimming
      (tool-group-aware). Not a registry plugin — tunable assembly params only.
    additionalProperties: false
    properties:
      max_tokens:
        type: integer
        minimum: 1
        description: Max estimated input tokens after assembly.
      token_budget:
        type: integer
        minimum: 1
        description: Alias for max_tokens.
      reserve_tokens:
        type: integer
        minimum: 0
        default: 512
        description: Tokens reserved for model completion.
  working_memory_ref:
    type: string
    description: Registry ref for working_memory context source plugin.
