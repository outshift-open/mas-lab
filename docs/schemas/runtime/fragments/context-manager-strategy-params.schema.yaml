$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#context-manager-strategy-params"
title: ContextManagerStrategyParams
description: >
  Constructor kwargs for concrete ContextManagerContract plugins (sliding-window,
  summarising, stack, etc.). Not passed to assembly-only knobs — see
  context-manager-assembly-params.schema.yaml.
type: object
additionalProperties: false
properties:
  max_turns:
    type: integer
    minimum: 1
    description: Sliding-window / summarising — max prior exchange pairs.
  window_size:
    type: integer
    minimum: 1
    description: Alias for max_turns (sliding-window).
  max_messages:
    type: integer
    minimum: 1
    description: Stack CM — cap total past messages.
  summary_threshold:
    type: integer
    minimum: 1
    description: Summarising CM — token threshold before compression.
  keep_turns:
    type: integer
    minimum: 1
    description: Summarising CM — recent pairs kept verbatim.
