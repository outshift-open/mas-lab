$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#llm-model-entry"
title: LlmModelEntry
description: >
  One spec.models[] row. Identity + static sampling/reasoning. Connection
  (api_base, api_key_env) belongs on infra, not here. Per-call dynamic
  fields belong on LLMProvider.chat_completion.
type: object
additionalProperties: false
properties:
  id:
    type: string
    description: "Logical model ID within this agent. Use 'main' for the primary model."
    default: "main"
  model:
    type: string
    description: >
      LiteLLM-style model string, e.g. gpt-4o, or `any`. `any`
      (and omitted, which compile writes as any) means this
      spec does not pin a provider id — inherit MAS / experiment
      models.<id> (models.main / experiment.model for id main),
      then local config.yaml defaults.model.
  kind:
    type: string
    description: >
      LLM wire-protocol plugin (openai now; bedrock later). Same role as
      infra ToolServerRegistry protocol for remote tools. Not cache.
  extra:
    type: object
    additionalProperties: true
    description: >
      Protocol-specific static fields forwarded on the Chat Completions body
      (and merged with per-call extra_body). Escape hatch for the overset.
  reasoning_effort:
    type: string
    enum: [none, disable, minimal, low, medium, high, xhigh, max]
    description: Deprecated alias for reasoning.effort.
  reasoning:
    $ref: "./llm-reasoning.schema.yaml"
  temperature:
    $ref: "./llm-sampling.schema.yaml#/properties/temperature"
  max_tokens:
    $ref: "./llm-sampling.schema.yaml#/properties/max_tokens"
  context_window:
    type: integer
    minimum: 1
    default: 128000
    description: >
      Model input context size in tokens. History is sized as
      context_window minus completion reserve (max_tokens, 2000 when unset)
      and any spec.context_manager.params.trimmer.reserve_tokens override.
      A set max_tokens is also lowered per call so prompt + completion
      fits in this window.
  max_completion_tokens:
    $ref: "./llm-sampling.schema.yaml#/properties/max_completion_tokens"
  on_truncation:
    $ref: "./llm-truncation.schema.yaml"
  min_tokens:
    $ref: "./llm-sampling.schema.yaml#/properties/min_tokens"
  min_p:
    $ref: "./llm-sampling.schema.yaml#/properties/min_p"
  repetition_penalty:
    $ref: "./llm-sampling.schema.yaml#/properties/repetition_penalty"
  service_tier:
    $ref: "./llm-sampling.schema.yaml#/properties/service_tier"
  store:
    $ref: "./llm-sampling.schema.yaml#/properties/store"
  metadata:
    $ref: "./llm-sampling.schema.yaml#/properties/metadata"
  modalities:
    $ref: "./llm-sampling.schema.yaml#/properties/modalities"
  prediction:
    $ref: "./llm-sampling.schema.yaml#/properties/prediction"
  prompt_cache_key:
    $ref: "./llm-sampling.schema.yaml#/properties/prompt_cache_key"
  top_p:
    $ref: "./llm-sampling.schema.yaml#/properties/top_p"
  top_k:
    $ref: "./llm-sampling.schema.yaml#/properties/top_k"
  presence_penalty:
    $ref: "./llm-sampling.schema.yaml#/properties/presence_penalty"
  frequency_penalty:
    $ref: "./llm-sampling.schema.yaml#/properties/frequency_penalty"
  seed:
    $ref: "./llm-sampling.schema.yaml#/properties/seed"
  n:
    $ref: "./llm-sampling.schema.yaml#/properties/n"
  stop:
    $ref: "./llm-sampling.schema.yaml#/properties/stop"
  logit_bias:
    $ref: "./llm-sampling.schema.yaml#/properties/logit_bias"
  user:
    $ref: "./llm-sampling.schema.yaml#/properties/user"
  verbosity:
    $ref: "./llm-sampling.schema.yaml#/properties/verbosity"
  response_format:
    $ref: "./llm-sampling.schema.yaml#/properties/response_format"
  logprobs:
    $ref: "./llm-sampling.schema.yaml#/properties/logprobs"
  top_logprobs:
    $ref: "./llm-sampling.schema.yaml#/properties/top_logprobs"
  parallel_tool_calls:
    $ref: "./llm-sampling.schema.yaml#/properties/parallel_tool_calls"
