$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#context-sources-binding"
title: ContextSourcesBinding
description: >
  List of ContextContract source plugin ids. Same list-of-plugins shape as
  observability/governance. Currently used to select the skill-plugin engine
  (native, adk, langchain) that backs SkillCatalogPlugin/SkillToolsPlugin —
  see library-skills/library.yaml. Plugin implementations are resolved at
  runtime from the plugin registry; unknown ids fail at load time.
type: array
items:
  oneOf:
    - type: string
      enum: [native, adk, langchain]
    - type: object
      additionalProperties: false
      minProperties: 1
      maxProperties: 1
      properties:
        native:
          type: object
          additionalProperties: false
          properties:
            base_dir:
              type: string
            auto_inject:
              type: boolean
              default: false
              description: >
                When true, grant the ``run_skill_script`` system tool (script
                execution) even if no listed skill has a ``scripts/`` directory.
                Off by default: listing skills only adds ``activate_skill``.
                A skill that already ships scripts implies the tool. Explicit
                alternative: ``{kind: system, name: run_skill_script}``.
            pin_activated:
              type: boolean
              default: true
              description: Pin activated skill bodies into SYSTEM_SKILLS.
            allow_unload:
              type: boolean
              default: false
              description: >
                When true, advertise ``unload`` on ``activate_skill`` so the
                model can call ``activate_skill(name, unload=true)``. Off by
                default: that parameter is not in the Agent Skills spec.
            auto_load:
              type: boolean
              default: false
              description: >
                When true, activate every listed skill at session start
                instead of waiting for ``activate_skill``.
        adk:
          type: object
          additionalProperties: false
          properties:
            base_dir:
              type: string
            auto_inject:
              type: boolean
              default: false
              description: >
                When true, grant the ``run_skill_script`` system tool (script
                execution) even if no listed skill has a ``scripts/`` directory.
                Off by default: listing skills only adds ``activate_skill``.
                A skill that already ships scripts implies the tool. Explicit
                alternative: ``{kind: system, name: run_skill_script}``.
            pin_activated:
              type: boolean
              default: true
              description: Pin activated skill bodies into SYSTEM_SKILLS.
            allow_unload:
              type: boolean
              default: false
              description: >
                When true, advertise ``unload`` on ``activate_skill`` so the
                model can call ``activate_skill(name, unload=true)``. Off by
                default: that parameter is not in the Agent Skills spec.
            auto_load:
              type: boolean
              default: false
              description: >
                When true, activate every listed skill at session start
                instead of waiting for ``activate_skill``.
        langchain:
          type: object
          additionalProperties: false
          properties:
            base_dir:
              type: string
            auto_inject:
              type: boolean
              default: false
              description: >
                When true, grant the ``run_skill_script`` system tool (script
                execution) even if no listed skill has a ``scripts/`` directory.
                Off by default: listing skills only adds ``activate_skill``.
                A skill that already ships scripts implies the tool. Explicit
                alternative: ``{kind: system, name: run_skill_script}``.
            pin_activated:
              type: boolean
              default: true
              description: Pin activated skill bodies into SYSTEM_SKILLS.
            allow_unload:
              type: boolean
              default: false
              description: >
                When true, advertise ``unload`` on ``activate_skill`` so the
                model can call ``activate_skill(name, unload=true)``. Off by
                default: that parameter is not in the Agent Skills spec.
            auto_load:
              type: boolean
              default: false
              description: >
                When true, activate every listed skill at session start
                instead of waiting for ``activate_skill``.
