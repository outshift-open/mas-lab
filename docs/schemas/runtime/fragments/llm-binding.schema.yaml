$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#llm-binding"
title: LlmBinding
description: >
  Deprecated compat shim for model id and sampling params on kind: Agent.
  Prefer spec.models[]. Retained for overlay patches (e.g. provider: mock).
type: object
additionalProperties: false
properties:
  model:
    type: string
  provider:
    type: string
    description: "Engine provider hint (mock, openai, azure, …)."
  temperature:
    type: number
    minimum: 0
    maximum: 2
  max_tokens:
    type: integer
    minimum: 1
