$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#governance-binding"
title: GovernanceBinding
description: >
  Governance plugin list (ordered plugin stanzas). Plugin ids are resolved
  at runtime from the plugin registry (see runtime/docs/plugin-registry-manifests.md)
  — this schema validates shape only (bare id, or a single id-keyed config
  object), not plugin identity. Any registered plugin, built-in or
  third-party, is valid here without editing this file.
type: array
items:
  oneOf:
    - type: string
      minLength: 1
    - type: object
      minProperties: 1
      maxProperties: 1
      additionalProperties:
        type: object
