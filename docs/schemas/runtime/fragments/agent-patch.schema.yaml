$schema: "https://json-schema.org/draft-07/schema#"
$id: "mas/v1#agent-patch"
title: AgentPatch
description: Per-agent override fields allowed in overlay patch.agents.
type: object
additionalProperties: false
patternProperties:
  "^x-": {}
properties:
  design_pattern:
    type: object
    additionalProperties: false
    properties:
      type:
        type: string
      ref:
        type: string
      params:
        $ref: "./design-pattern-config.schema.yaml"
      config:
        $ref: "./design-pattern-config.schema.yaml"
  collaboration:
    type: object
    additionalProperties: false
    properties:
      type:
        type: string
      ref:
        type: string
      params:
        $ref: "./context-manager-params.schema.yaml"
      skills:
        $ref: "./overlay-collection-ops-string.schema.yaml"
  llm:
    $ref: "./llm-binding.schema.yaml"
  execution:
    $ref: "./execution-binding.schema.yaml"
  memory:
    type: string
  tools:
    $ref: "./overlay-collection-ops-tool.schema.yaml"
  skills:
    $ref: "./overlay-collection-ops-string.schema.yaml"
  context:
    type: object
    additionalProperties:
      $ref: "./context-chunk.schema.yaml"
  description:
    type: string
  ref:
    type: string
    description: Agent manifest path when replacing agent list entry.
