apiVersion: mas/v1
kind: Agent
metadata:
  name: bounded-reviewer
spec:
  description: Coordinates a bounded review.
  tools:
    - kind: system
      name: spawn_subagent
      params:
        templates:
          - id: reviewer
            ref: ./reviewer.yaml
            description: Review a proposed change.
        max_spawns: 8
        max_depth: 3