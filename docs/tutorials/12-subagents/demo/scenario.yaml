name: tutorial-12-subagents
title: "Tutorial 12 — Spawned subagents"
description: >
  Run bounded, pre-authored subagent templates during a turn.
version: "1.0"
authors: ["MAS Framework Team"]
tags: ["subagents", "tutorial"]
prerequisites:
  - "Tutorial 0"
  - "Offline: pytest tests/tutorials/test_scenario_commands.py -k tuto-12"
estimated_duration_min: 10
working_dir: . # repo root
cache_dir: ".demo-cache"

sections:
  - id: validate
    title: "Validate"
    steps:
      - type: command
        title: "Validate the parent agent"
        command: mas-ctl validate docs/tutorials/12-subagents/agent.yaml
        allowed_modes: [offline]
        expected_exit_code: 0
        expected_output: "OK"

      - type: command
        title: "Validate the reviewer template"
        command: mas-ctl validate docs/tutorials/12-subagents/reviewer.yaml
        allowed_modes: [offline]
        expected_exit_code: 0
        expected_output: "OK"
