name: tutorial-04-mcp-tools
title: "Tutorial 04 — MCP tools"
description: >
  Discover and dispatch local and remote tools through a stable contract.
  Reuses Tutorial 01's agent.yaml plus library-samples/tools/*.tool.yaml and
  library-samples/infra/mixed-tools.infra.yaml. The MCP serve/discover/
  dispatch round trip itself needs a background server process, which this
  scenario format cannot express — see
  tests/tutorials/test_tutorial_04.py for that coverage.
version: "1.0"
authors: ["MAS Framework Team"]
tags: ["mcp", "tutorial"]
prerequisites:
  - "Tutorial 0, Tutorial 1"
  - "Offline: pytest tests/tutorials/test_scenario_commands.py -k tuto-04"
estimated_duration_min: 10
working_dir: . # repo root
cache_dir: ".demo-cache"

sections:
  - id: validate
    title: "Validate"
    steps:
      - type: command
        title: "Validate Tutorial 01's agent with its tools overlay"
        command: >-
          mas-ctl validate docs/tutorials/01-building-an-agent/agent.yaml
          -o docs/tutorials/01-building-an-agent/overlays/tools.yaml
        allowed_modes: [offline]
        expected_exit_code: 0
        expected_output: "OK"
