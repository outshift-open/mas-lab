# Tutorial 13 auto-checkpoint agent — every_turn + tool-error backtrack tree.
apiVersion: mas/v1
kind: Agent

metadata:
  name: debug-script-auto

spec:
  models:
    - model: gpt-4o-mini
  description: "Same tools as tutorial 8, with automatic checkpoints and error backtrack."
  context:
    role: |
      You are a research assistant. Use calc for arithmetic.
      If a tool errors, try once more.
  tools:
    - ref: ./tools/calc-flaky.tool.yaml
  checkpoint:
    mode: every_turn
    retention:
      mode: all
  governance:
    - sample:
        error_recovery_plugin: backtrack_on_error
        backtrack:
          repeat_threshold: 2
          max_backtracks_per_session: 3
          steps: 1
          on_cap_reached: stop_backtracking
  observability:
    - native
