experiment:
  name: t3-topology-comparison
  description: Tutorial 03 smoke comparison of trip-planner topology overlays.
  default_flavour: local
  models:
    main: gpt-4o-mini
  application:
    app: trip-planner
    configs_dir: ./topologies
  scenarios:
  - id: single-agent
    description: Single-agent — all tools in one agent
    overlays:
      logic: [single-agent]
      control: []
      infra: []
  - id: linear
    description: Linear pipeline — schedule then itinerary
    overlays:
      logic: [linear]
      control: []
      infra: []
  - id: moderator
    description: Moderator topology — dynamic delegation
    overlays:
      logic: [moderator]
      control: []
      infra: []
  dataset:
    path: ./dataset-topology.yaml
  run:
    n_runs: 1
  post: []
