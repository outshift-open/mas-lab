name: tutorial-08-kg-oxp
title: "Tutorial 08 — KG & OXP"
description: >
  Native→KG and OTel→KG using library-kg/examples/qa-agent (same layout as
  examples/trip-planner).
version: "1.0"
authors: ["MAS Framework Team"]
tags: ["kg", "oxp", "norm", "tutorial"]
prerequisites:
  - "Tutorial 7"
  - "mas-lab on PATH with mas-library-kg"
  - "Offline: pytest tests/tutorials/test_scenario_commands.py -k tuto-08"
estimated_duration_min: 20
working_dir: . # repo root — examples live in library-kg/
cache_dir: ".demo-cache"

sections:
  - id: normalize
    title: "Normalize"
    steps:
      - type: command
        title: "Native to KG"
        command: >-
          python -c
          "from pathlib import Path; from mas.library.kg.steps.normalize import run_normalize;
          art=run_normalize(Path('library-kg/examples/qa-agent/events.jsonl'), run_id='t8-native', output_dir=Path('/tmp/t8-native-kg'));
          print(art.node_count, 'nodes')"
        allowed_modes: [offline]
        requires: [mas.library.kg]
        expected_exit_code: 0
        expected_output: "nodes"

      - type: command
        title: "OTel to KG"
        command: >-
          python -c
          "from pathlib import Path; from mas.library.kg.steps.normalize_otel import run_normalize_otel;
          art=run_normalize_otel(Path('library-kg/examples/qa-agent/otel_spans.jsonl'), run_id='t8-otel', output_dir=Path('/tmp/t8-otel-kg'));
          print(art.node_count, 'nodes')"
        allowed_modes: [offline]
        requires: [mas.library.kg, norm]
        expected_exit_code: 0
        expected_output: "nodes"

  - id: neo4j
    title: "Neo4j dry-run"
    steps:
      - type: command
        title: "neo4j-push dry-run"
        command: mas-lab kg neo4j-push library-kg/examples/qa-agent/kg-native.jsonld --dry-run
        allowed_modes: [offline]
        requires: [mas.library.kg]
        expected_exit_code: 0
        expected_output: "dry_run"
