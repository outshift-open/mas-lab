# Overlay: skills — list answer-formatting. That is enough: activate_skill
# is added as a system tool, and the catalog lists this skill's frontmatter.
apiVersion: mas/v1
kind: Overlay
metadata:
  name: skills
spec:
  target:
    kind: Agent
  patch:
    skills:
      $op:
        add:
          - answer-formatting
