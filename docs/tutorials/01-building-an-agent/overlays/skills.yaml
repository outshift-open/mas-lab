# Overlay: skills — tool + context injection
apiVersion: mas/v1
kind: Overlay
metadata:
  name: skills
spec:
  target:
    kind: Agent
  patch:
    skills:
      $op:
        add:
          - answer-formatting
    context_manager:
      skills:
        $op:
          add:
            - answer-formatting
