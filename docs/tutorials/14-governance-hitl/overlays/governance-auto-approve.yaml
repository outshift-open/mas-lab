apiVersion: mas/v1
kind: Overlay

metadata:
  name: budget-governance-auto-approve

spec:
  target:
    kind: Agent
  patch:
    governance:
      $op:
        add:
          - sample_governance:
              hitl_on_tool: true
              hitl_on_tool_result: false
              hitl_once_per_turn: false
              hitl_mode: auto-approve
