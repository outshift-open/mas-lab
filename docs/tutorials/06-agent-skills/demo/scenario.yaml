name: tutorial-06-agent-skills
title: "Tutorial 06 — Agent skills"
description: >
  Teach an agent a reusable skill — procedure, reference material, and a
  checked script — without folding it into the agent's own instructions.
version: "1.0"
authors: ["MAS Framework Team"]
tags: ["skills", "tutorial"]
prerequisites:
  - "Tutorial 0"
  - "Offline: pytest tests/tutorials/test_scenario_commands.py -k tuto-06"
estimated_duration_min: 10
working_dir: . # repo root
cache_dir: ".demo-cache"

sections:
  - id: validate
    title: "Validate"
    steps:
      - type: command
        title: "Validate the base agent"
        command: mas-ctl validate docs/tutorials/06-agent-skills/agent.yaml
        allowed_modes: [offline]
        expected_exit_code: 0
        expected_output: "OK"

      - type: command
        title: "Validate with the skills overlay"
        command: >-
          mas-ctl validate docs/tutorials/06-agent-skills/agent.yaml
          -o docs/tutorials/06-agent-skills/overlays/with-skills.yaml
        allowed_modes: [offline]
        expected_exit_code: 0
        expected_output: "OK"

  - id: script
    title: "Checked script"
    steps:
      - type: command
        title: "Run the skill's conversion script directly"
        command: >-
          python docs/tutorials/06-agent-skills/skills/answer-expert/scripts/convert_speed.py
          299792458
        allowed_modes: [offline]
        expected_exit_code: 0
        expected_output: "299792.458"
