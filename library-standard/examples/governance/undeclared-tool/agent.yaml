# Governance example agent for gov_no_undeclared_tool.
# spec.tools is the offer; the skill still names get_deployments.
#
#   mas-ctl validate library-standard/examples/governance/undeclared-tool/agent.yaml
#   mas-ctl chat library-standard/examples/governance/undeclared-tool/agent.yaml \
#     -q "Investigate the latency spike for payment-service."
apiVersion: mas/v1
kind: Agent

metadata:
  name: telemetry

spec:
  models:
    - model: gpt-4o-mini
  description: "Telemetry specialist. Tools listed here are the only names this agent may call."
  context:
    role: |
      You are a telemetry analyst. Use tools.
  tools:
    - ref: ./tools/get_metrics.tool.yaml
    - ref: ./tools/get_logs.tool.yaml
    - ref: ./tools/get_service_health.tool.yaml
  skills:
    - data-access-protocol
  governance:
    - gov_no_undeclared_tool
  observability:
    - native
