apiVersion: mas/v1
kind: Tool
metadata:
  name: get_logs
  description: Fetch logs for a service.
  version: "1.0.0"
spec:
  description: >
    Call this tool when you need logs for a named service.
  parameters:
    - name: service
      type: string
      description: Canonical service name.
      required: true
      examples: ["payment-service"]
  impl:
    kind: python
    module_path: ./telemetry.py
    class_name: TelemetryStub
    params:
      name: get_logs
      description: Fetch logs for a service.
