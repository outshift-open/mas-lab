# Refuse tool names the model was not given in this LLM call's `tools` list,
# even when the agent spec lists them. Appended onto the governance chain
# ($op.add); BLOCK exits the chain, ALLOW passes to the next plugin.
apiVersion: mas/v1
kind: Overlay
metadata:
  name: with-hardened
spec:
  target:
    kind: Agent
  patch:
    governance:
      $op:
        add:
          - gov_no_undeclared_tool
