name: Publish Package

on:
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish"
        required: true
        type: choice
        options:
          - all
          - runtime
          - ctl
          - library
          - skills
          - samples
          - eval
          - lab-library
          - ioa
          - lab
          - core
          - bench
          - controller
      bump_type:
        description: "Version bump type"
        required: false
        type: choice
        options:
          - none
          - patch
          - minor
          - major
          - rc
        default: "none"
      publish:
        description: "Upload artifacts to public PyPI"
        required: false
        type: boolean
        default: false
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mcp-compliance-release:
    name: MCP compliance release report
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Setup Python 3.13
        run: uv python install 3.13

      - name: Install go-task
        run: |
          sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b "${{ runner.temp }}/bin"
          echo "${{ runner.temp }}/bin" >> "$GITHUB_PATH"

      - name: Install MCP compliance dependencies
        run: task --dir library-ioa/compliance/mcp install

      - name: Validate MCP compliance configuration
        run: task --dir library-ioa/compliance/mcp validate-config

      - name: Run MCP unit tests
        run: .venv/bin/pytest library-ioa/tests/mcp -q

      - name: Run both MCP requirement sets
        run: |
          MCP_CONFORMANCE_RESULTS="${{ github.workspace }}/library-ioa/compliance/mcp/results" \
            ./library-ioa/compliance/mcp/mcp-conformance.sh

      - name: Upload release MCP compliance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-compliance-${{ github.ref_name }}
          path: library-ioa/compliance/mcp/results/
          if-no-files-found: warn
          retention-days: 90

  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          # Order matters: dependencies must be built first
          - name: runtime
            path: runtime
          - name: skills
            path: library-skills
          - name: library
            path: library-standard
          - name: samples
            path: library-samples
          - name: eval
            path: library-eval
          - name: lab-library
            path: library-lab
          - name: ioa
            path: library-ioa
          - name: ctl
            path: ctl
          - name: core
            path: lab/components/core
          - name: controller
            path: lab/components/controller
          - name: lab
            path: lab
          - name: bench
            path: lab/components/bench

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check if package should be published
        id: check
        run: |
          PKG="${{ matrix.name }}"
          INPUT="${{ github.event.inputs.package || 'all' }}"
          if [[ "$INPUT" == "all" || "$INPUT" == "$PKG" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Python
        if: steps.check.outputs.should_publish == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        if: steps.check.outputs.should_publish == 'true'
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Install build tools
        if: steps.check.outputs.should_publish == 'true'
        run: |
          uv tool install build
          uv tool install twine

      - name: Bump version (if requested)
        if: >
          steps.check.outputs.should_publish == 'true' && github.event_name ==
          'workflow_dispatch' && inputs.publish == true &&
          github.event.inputs.bump_type != 'none'
        run: |
          python3 scripts/version_manager.py bump \
            ${{ github.event.inputs.bump_type }} \
            ${{ matrix.name }}

      - name: Get version
        if: steps.check.outputs.should_publish == 'true'
        id: version
        run: |
          VERSION=$(python3 scripts/version_manager.py get ${{ matrix.name }})
          FULL=$(python3 scripts/version_manager.py get-full ${{ matrix.name }})
          echo "base=$VERSION" >> "$GITHUB_OUTPUT"
          echo "full=$FULL" >> "$GITHUB_OUTPUT"

      - name: Build package
        if: steps.check.outputs.should_publish == 'true'
        run: pyproject-build "${{ matrix.path }}"

      - name: Check package
        if: steps.check.outputs.should_publish == 'true'
        run: uvx twine check "${{ matrix.path }}/dist/"*

      - name: Publish to PyPI
        if: >
          steps.check.outputs.should_publish == 'true' &&
          (github.event_name == 'push' || inputs.publish == true)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.path }}/dist/
          skip-existing: true

      - name: Upload artifacts
        if: always() && steps.check.outputs.should_publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}-${{ github.sha }}
          path: ${{ matrix.path }}/dist/*
          retention-days: 30

  commit-version:
    needs: publish
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' && github.event.inputs.bump_type
      != 'none' && inputs.publish == true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump all versions
        run: |
          python3 scripts/version_manager.py bump \
            ${{ github.event.inputs.bump_type }} \
            ${{ github.event.inputs.package }}

      - name: Commit and tag
        run: |
          VERSION=$(python3 scripts/version_manager.py get lab)
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add VERSION -- ':(glob)**/pyproject.toml'
          git commit -m "chore: bump version to $VERSION" || true
          git tag "v$VERSION"
          git push && git push --tags
