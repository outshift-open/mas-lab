# Smoke version of Lab 1 / Exp 1.3 collaboration-patterns experiment.
#
# Run:
#   mas-lab benchmark run labs/design-space.lab/03-collaboration-patterns/experiment-smoke.yaml --progress

experiment:
  name: "lab1-exp1.3-collaboration-patterns-trip-planner-smoke"
  description: >
    Smoke benchmark for collaboration pattern comparison on trip-planner.
    Same 6 scenarios as the full factorial experiment, but smaller dataset
    and 1 run for fast validation in CI/local workflows.

  default_flavour: local

  applications:
    - app: trip-planner
      configs_dir: "./overlays"

  scenarios:
    - id: collab-broker-react
    - id: collab-broker-cot
    - id: collab-broker-reflection
    - id: collab-parallel-react
    - id: collab-parallel-cot
    - id: collab-parallel-reflection

  dataset:
    name: trip-planner-benchmark-100
    locator: samples
    limit: 10

  execution:
    parallel_scenarios: 4
    timeout: 300
    pause_between_runs: 1.0
    strategy: coverage
    reset_state: true
    emulation:
      infra:
        llm: live
        tools: live
      runtime:
        cache: content-addressed

  run:
    n_runs: 1

  pipeline_bind: experiment/post

  application:
    post:
      - name: eval-quality
        type: eval_mce
        config:
          max_workers: 2
          fail_threshold: 0.5
          overwrite: true
          metrics:
            - goal_success_rate
            - answer_relevancy

      - name: collect-metrics
        type: collect_metrics
        depends_on: [eval-quality]
