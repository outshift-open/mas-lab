# Lab 1 / Exp 1.3 — Collaboration Pattern Sweep on Trip Planner
#
# Design goal:
#   Extend Exp 1.2 (topologies) with a factorial comparison of collaboration
#   patterns on the same trip-planner benchmark:
#   - topology axis: moderator-broker vs parallel fan-out
#   - moderator pattern axis: ReAct vs CoT vs Reflection
#
# Run:
#   mas-lab benchmark run labs/design-space.lab/03-collaboration-patterns/experiment.yaml --progress
#
# Smoke run:
#   mas-lab benchmark run labs/design-space.lab/03-collaboration-patterns/experiment.yaml --max-items 10 --progress

experiment:
  name: "lab1-exp1.3-collaboration-patterns-trip-planner"
  description: >
    Extends Lab 1 topology experiment with a 2x3 factorial design on the
    trip-planner MAS. We compare collaboration patterns by varying both
    topology (moderator-broker vs parallel) and moderator design pattern
    (react, cot, reflection) while keeping agents, tools, and dataset fixed.

  default_flavour: local
  metadata:
    model_name: "gpt-4o"
    model_endpoint: "https://api.openai.com/v1"
    dataset_version: "trip-planner-benchmark-100 v1.0"
    notes: >
      Factorial design: 6 scenarios = 2 topologies x 3 moderator patterns.
      Reuses paper lab conventions (eval_mce + collect_metrics + compute_ci)
      and adds trace overhead analysis via extract_trace_stats.

  output_schema:
    required_files:
      - "results/ci_summary.csv"
      - "results/figure-03-collab-overhead-quality.png"
      - "results/figure-03-collab-llm-calls.png"
    required_columns:
      results/ci_summary.csv:
        [scenario, metric, mean, ci_low, ci_high, latency_s_mean]

  applications:
    - app: trip-planner
      configs_dir: "./overlays"

  scenarios:
    - id: collab-broker-react
      description: "Moderator-broker topology + ReAct moderator"

    - id: collab-broker-cot
      description: "Moderator-broker topology + CoT moderator"

    - id: collab-broker-reflection
      description: "Moderator-broker topology + Reflection moderator"

    - id: collab-parallel-react
      description: "Parallel topology + ReAct moderator"

    - id: collab-parallel-cot
      description: "Parallel topology + CoT moderator"

    - id: collab-parallel-reflection
      description: "Parallel topology + Reflection moderator"

  dataset:
    name: trip-planner-benchmark-100
    locator: samples
    limit: 100

  execution:
    parallel_scenarios: 4
    timeout: 300
    pause_between_runs: 1.0
    strategy: coverage
    reset_state: true
    emulation:
      infra:
        llm: live
        tools: live
      runtime:
        cache: content-addressed

  run:
    n_runs: 3

  pipeline_bind: experiment/post

  application:
    post:
      - name: eval-quality
        type: eval_mce
        config:
          max_workers: 2
          fail_threshold: 0.5
          overwrite: true
          metrics:
            - goal_success_rate
            - answer_relevancy

      - name: collect-metrics
        type: collect_metrics
        depends_on: [eval-quality]
        config:
          scenarios:
            [
              collab-broker-react,
              collab-broker-cot,
              collab-broker-reflection,
              collab-parallel-react,
              collab-parallel-cot,
              collab-parallel-reflection,
            ]

      - name: compute-ci
        type: compute_ci
        depends_on: [collect-metrics]
        config:
          data: "@collect-metrics"
          groupby: [scenario, metric]
          metrics: [answer_relevancy, goal_success_rate]
          extra_cols: [latency_s]
          ci_method: t
          ci_level: 0.95
          output: "{output_dir}/results/ci_summary.csv"

      - name: extract-trace-stats
        type: extract_trace_stats
        config:
          output: "{output_dir}/results/trace_stats.csv"

      - name: figure-overhead-quality
        type: plotnine
        depends_on: [collect-metrics, compute-ci]
        config:
          data: "@compute-ci"
          filter:
            metric: [goal_success_rate]
          mapping:
            x: latency_s_mean
            y: mean
            color: scenario
            xmin: latency_s_ci_low
            xmax: latency_s_ci_high
            ymin: ci_low
            ymax: ci_high
          layers:
            - data: "@collect-metrics"
              geom: point
              filter:
                metric: [goal_success_rate]
              mapping:
                x: latency_s
                y: value
                color: scenario
              alpha: 0.22
              size: 1.8
              stroke: 0.0
          geom: point
          point_size: 3.5
          alpha: 0.92
          labels:
            title: "Collaboration patterns: quality vs latency"
            subtitle: "Mean ± 95% CI (n=3 runs) with per-run scatter"
            x: "Session Latency (s)"
            y: "Goal Success Rate"
            color: "Scenario"
          output: "{output_dir}/results/figure-03-collab-overhead-quality.png"
          width: 9
          height: 5
          rename_values:
            scenario:
              collab-broker-react: "Broker + ReAct"
              collab-broker-cot: "Broker + CoT"
              collab-broker-reflection: "Broker + Reflection"
              collab-parallel-react: "Parallel + ReAct"
              collab-parallel-cot: "Parallel + CoT"
              collab-parallel-reflection: "Parallel + Reflection"

      - name: figure-llm-calls
        type: plotnine
        depends_on: [extract-trace-stats]
        config:
          data: "@extract-trace-stats"
          mapping: { x: scenario, y: n_llm_calls, fill: scenario }
          geom: col
          stat: summary
          labels:
            title: "Collaboration patterns: LLM call overhead"
            subtitle: "Mean llm_call_start events per run"
            x: ""
            y: "LLM calls / run"
          output: "{output_dir}/results/figure-03-collab-llm-calls.png"
          width: 8.0
          height: 4.0
          hide_x_labels: true
          rename_values:
            scenario:
              collab-broker-react: "Broker + ReAct"
              collab-broker-cot: "Broker + CoT"
              collab-broker-reflection: "Broker + Reflection"
              collab-parallel-react: "Parallel + ReAct"
              collab-parallel-cot: "Parallel + CoT"
              collab-parallel-reflection: "Parallel + Reflection"

      - name: figure-factorial-interaction
        type: plotnine
        depends_on: [collect-metrics]
        config:
          data: "@collect-metrics"
          filter:
            metric: [goal_success_rate]
          transform:
            topology: "'parallel' if 'parallel' in scenario else 'broker'"
            moderator_pattern: "'react' if 'react' in scenario else ('cot' if 'cot' in scenario else 'reflection')"
          mapping:
            x: moderator_pattern
            y: value
            color: topology
            group: topology
          geom: point
          stat: summary
          layers:
            - data: "@collect-metrics"
              filter:
                metric: [goal_success_rate]
              transform:
                topology: "'parallel' if 'parallel' in scenario else 'broker'"
                moderator_pattern: "'react' if 'react' in scenario else ('cot' if 'cot' in scenario else 'reflection')"
              geom: line
              stat: summary
              mapping:
                x: moderator_pattern
                y: value
                color: topology
                group: topology
              alpha: 0.8
            - data: "@collect-metrics"
              filter:
                metric: [goal_success_rate]
              transform:
                topology: "'parallel' if 'parallel' in scenario else 'broker'"
                moderator_pattern: "'react' if 'react' in scenario else ('cot' if 'cot' in scenario else 'reflection')"
              geom: point
              mapping:
                x: moderator_pattern
                y: value
                color: topology
              alpha: 0.18
              size: 1.5
          labels:
            title: "Factorial interaction: topology x moderator pattern"
            subtitle: "Goal Success Rate means (lines) with per-run scatter"
            x: "Moderator pattern"
            y: "Goal Success Rate"
            color: "Topology"
          output: "{output_dir}/results/figure-03-collab-factorial-interaction.png"
          width: 7.5
          height: 4.5
          rename_values:
            topology:
              broker: "Moderator-Broker"
              parallel: "Parallel"
            moderator_pattern:
              react: "ReAct"
              cot: "CoT"
              reflection: "Reflection"
