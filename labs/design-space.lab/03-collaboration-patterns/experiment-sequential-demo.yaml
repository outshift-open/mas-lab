# Minimal demo: deterministic sequential/linear chain.
#
# Run:
#   mas-lab benchmark run labs/design-space.lab/03-collaboration-patterns/experiment-sequential-demo.yaml --progress

experiment:
  name: "trip-planner-sequential-linear-demo"
  description: >
    Minimal demonstration of a deterministic sequential/linear collaboration
    topology: moderator -> schedule_agent -> itinerary_agent -> concierge_agent.

  default_flavour: local

  applications:
    - app: trip-planner
      configs_dir: "./overlays"

  scenarios:
    - id: sequential-linear
      description: "Deterministic chain, one agent at a time"
      overlays:
        logic:
          - example-sequential-linear
        control: []
        infra: []

  dataset:
    name: trip-planner-benchmark-100
    locator: samples
    limit: 3

  execution:
    parallel_scenarios: 1
    timeout: 300
    pause_between_runs: 1.0
    strategy: coverage
    reset_state: true
    emulation:
      infra:
        llm: live
        tools: live
      runtime:
        cache: content-addressed

  run:
    n_runs: 1

  pipeline_bind: experiment/post

  application:
    post:
      - name: extract-trace-stats
        type: extract_trace_stats
        config:
          output: "{output_dir}/results/trace_stats.csv"
