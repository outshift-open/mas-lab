apiVersion: mas/v1
kind: Overlay
metadata:
  id: topo-verifier
  description: >
    Verifier topology — deterministic propose-then-verify pattern.
    itinerary_agent proposes, schedule_agent verifies factual correctness.
  notes: >
    concierge_agent intentionally excluded — this topology focuses on factual
    correctness of schedule/cost claims. Comparing with topo-moderator-broker
    (which includes concierge) exposes the accuracy-coverage tradeoff.
  tags: [topology, exp-1.2]

spec:
  target:
    kind: MAS
  patch:
    workflow:
      entry: moderator
      nodes:
        - id: moderator
          delegates_to: [itinerary_agent, schedule_agent]
        - id: itinerary_agent
        - id: schedule_agent
    agents:
      moderator:
        design_pattern:
          type: deterministic_verifier
