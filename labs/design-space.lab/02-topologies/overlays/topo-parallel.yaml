apiVersion: mas/v1
kind: Overlay
metadata:
  id: topo-parallel
  description: >
    Parallel topology — deterministic fan-out to all specialists simultaneously.
    Entry agent receives task and dispatches to all participants in parallel,
    then aggregates results.
  tags: [topology, exp-1.2]

spec:
  target:
    kind: MAS
  patch:
    workflow:
      entry: moderator
      nodes:
        - id: moderator
          dispatch: parallel
          delegates_to: [schedule_agent, itinerary_agent, concierge_agent]
        - id: schedule_agent
        - id: itinerary_agent
        - id: concierge_agent
    agents:
      moderator:
        design_pattern:
          type: deterministic_parallel
