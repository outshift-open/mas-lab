apiVersion: mas/v1
kind: Overlay
metadata:
  id: topo-moderator-broker
  description: "Moderator-broker topology — LLM-driven dynamic delegation"
  tags: [topology, exp-1.2]

spec:
  target:
    kind: MAS
  patch:
    workflow:
      entry: moderator
      nodes:
        - id: moderator
          delegates_to: [schedule_agent, itinerary_agent, concierge_agent]
        - id: schedule_agent
        - id: itinerary_agent
        - id: concierge_agent
    agents:
      moderator:
        design_pattern:
          type: react
          config:
            max_steps: 10
