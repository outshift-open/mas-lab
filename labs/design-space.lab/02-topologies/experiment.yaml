#
# Lab 1 / Exp 1.2 — Topology sweep on trip-planner (paper §5.1)
#
# Hierarchy: experiment → scenario (topology overlay) → test (dataset item) → run
#   5 scenarios × 100 tests × 1 run = 500 executions
#
# Pipeline levels — each step consumes/produces a named artifact at that level.
#   run.post          events.jsonl → metrics.json → data.csv
#   test.post         gather run data.csv → test data.csv
#   scenario.post     gather test data.csv → scenario data.csv
#   application.post  gather scenario data.csv → experiment df → CI → plot
#
#   mas-lab benchmark run labs/design-space.lab/02-topologies/experiment.yaml --progress

experiment:
  name: "lab1-exp1.2-topologies-trip-planner"
  description: >
    Exp 02 of Lab 1 (§5.1). Sweeps 5 collaboration topologies on the 4-agent
    trip-planner MAS across the 100-item trip-planner-benchmark-100 dataset.
    Topology is a declarative overlay — agent code is unchanged. Topologies:
    linear-pipeline, parallel, moderator-broker, supervised, verifier.

  default_flavour: local
  metadata:
    model_name: "gpt-4o"
    model_endpoint: "https://api.openai.com/v1"
    dataset_version: "trip-planner-benchmark-100 v1.0"
    notes: >
      Baseline: MAS Framework main branch. Each topology is evaluated on the same
      100-item trip-planner dataset. Model sensitivity analysis can be run by
      updating model_name and re-running eval_mce + compute_ci steps only.

  output_schema:
    required_files:
      - "results/ci_summary.csv"
      - "figure-02-overhead-quality.png"
    required_columns:
      results/ci_summary.csv:
        [scenario, metric, mean, ci_low, ci_high, latency_s_mean]

  applications:
    - app: trip-planner
      configs_dir: "./overlays"

  scenarios:
    - id: topo-parallel
      description: "Parallel — moderator fans out to all specialists concurrently"
      overlays:
        logic: [topo-parallel]
        control: []
        infra: []

    - id: topo-linear-pipeline
      description: "Linear pipeline — agents execute in a fixed sequential chain"
      overlays:
        logic: [topo-linear-pipeline]
        control: []
        infra: []

    - id: topo-moderator-broker
      description: "Moderator-broker — dynamic delegation to the right specialist"
      overlays:
        logic: [topo-moderator-broker]
        control: []
        infra: []

    - id: topo-supervised
      description: "Supervised — supervisor reviews and approves each output"
      overlays:
        logic: [topo-supervised]
        control: []
        infra: []

    - id: topo-verifier
      description: "Verifier — a dedicated verifier checks all agent outputs"
      overlays:
        logic: [topo-verifier]
        control: []
        infra: []

  dataset:
    name: trip-planner-benchmark-100
    locator: samples
    limit: 100

  execution:
    parallel_scenarios: 4
    timeout: 300
    pause_between_runs: 0
    strategy: coverage
    emulation:
      infra:
        llm: live
        tools: live
      runtime:
        cache: content-addressed

  run:
    n_runs: 1
    artifacts:
      trace:
        type: trace
        path: "{run_dir}/traces/events.jsonl"
      metrics: metrics
      df:
        type: dataframe
        path: "{level_dir}/data.csv"
    post:
      - name: eval-quality
        type: eval_mce
        in: trace
        out: metrics
        config:
          overwrite: false
          metrics:
            - goal_success_rate
            - answer_relevancy
      - name: run-df
        type: metrics_to_dataframe
        in: metrics
        out: df
        depends_on: [eval-quality]

  test:
    artifacts:
      df:
        type: dataframe
        path: "{level_dir}/data.csv"
    post:
      - name: gather-test
        type: gather_level
        in: df
        out: df
        depends_on: [run-df]
        config:
          output: data.csv

  scenario:
    artifacts:
      df:
        type: dataframe
        path: "{level_dir}/data.csv"
    post:
      - name: gather-scenario
        type: gather_level
        in: df
        out: df
        depends_on: [gather-test]
        config:
          output: data.csv

  application:
    artifacts:
      df:
        type: dataframe
        path: "{level_dir}/data.csv"
      figure-02-overhead-quality: plot
    post:
      - name: gather-experiment
        type: gather_level
        in: df
        out: df
        depends_on: [gather-scenario]
        config:
          output: data.csv

      - name: compute-ci
        type: compute_ci
        depends_on: [gather-experiment]
        config:
          data: "@gather-experiment"
          groupby: [scenario, metric]
          metrics: [answer_relevancy, goal_success_rate]
          pre_aggregate:
            by: [scenario, metric, item_id]
            agg: mean
          extra_cols: [latency_s]
          ci_method: t
          ci_level: 0.95
          output: "{output_dir}/results/ci_summary.csv"

      - name: figure-overhead-quality
        type: plotnine
        depends_on: [gather-experiment, compute-ci]
        config:
          data: "@compute-ci"
          df_schema:
            required_columns:
              [
                scenario,
                metric,
                mean,
                ci_low,
                ci_high,
                latency_s_mean,
                latency_s_ci_low,
                latency_s_ci_high,
              ]
            required_groups:
              scenario:
                [
                  topo-parallel,
                  topo-linear-pipeline,
                  topo-moderator-broker,
                  topo-supervised,
                  topo-verifier,
                ]
              metric: [answer_relevancy, goal_success_rate]
          mapping:
            x: latency_s_mean
            y: mean
            color: scenario
            shape: metric
            xmin: latency_s_ci_low
            xmax: latency_s_ci_high
            ymin: ci_low
            ymax: ci_high
          layers:
            - data: "@compute-ci"
              geom: line
              mapping:
                x: latency_s_mean
                y: mean
                group: scenario
              color: "#666666"
              linetype: "dotted"
              alpha: 0.85
              size: 0.8
            - data: "@gather-experiment"
              geom: point
              mapping:
                x: latency_s
                y: value
                color: scenario
              alpha: 0.25
              size: 2.0
              stroke: 0.0
          geom: point
          point_size: 3.5
          alpha: 0.92
          x_limits: [0, 300]
          oov_x:
            enabled: true
            max: 300
            shape: ">"
            size: 2.4
            alpha: 0.75
          legend_position: [0.98, 0.02]
          legend_justification: [1, 0]
          errorbarh_height: 0.02
          labels:
            x: "Session Latency (s)"
            y: "Score (AR / GSR)"
            color: "Topology"
            shape: "Metric"
          output: "{output_dir}/figure-02-overhead-quality.png"
          width: 8
          height: 5
          rename_values:
            metric:
              answer_relevancy: "Answer Relevancy"
              goal_success_rate: "Goal Success Rate"
            scenario:
              topo-parallel: "Parallel"
              topo-linear-pipeline: "Linear Pipeline"
              topo-moderator-broker: "Moderator-Broker"
              topo-supervised: "Supervised"
              topo-verifier: "Verifier"
