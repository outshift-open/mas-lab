apiVersion: mas/v1
kind: Overlay
metadata:
  id: pattern-reflection
  description: "Reflection / Introspection — periodic self-review loop after each N steps"

spec:
  target:
    kind: Agent
  patch:
    design_pattern:
      type: reflection
      config:
        max_steps: 10
