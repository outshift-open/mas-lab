apiVersion: mas/v1
kind: Overlay
metadata:
  name: with-guardrail
# +Guardrail: blocks forbidden content (Shadowmere).
#
# target.kind: Agent on a MAS fans this patch out onto every
# spec.agency.agents[] row. compose / run-mas then merge those rows onto
# the agent YAML (governance/observability union, not replace).
spec:
  target:
    kind: Agent
  patch:
    observability:
      - native
    governance:
      - sample_governance:
          policies:
            - name: forbidden-destination
              trigger:
                "on": tool_input
                tool: "*"
                condition: 'arguments.destination == "Shadowmere"'
                evaluation: deterministic
              action: block
              params: { message: "Restricted destination: Shadowmere" }
