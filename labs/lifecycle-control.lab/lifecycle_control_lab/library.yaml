# Lab-local library for lifecycle-control.lab.
# The package name is unique across libraries: lab roots and library parents
# share one sys.path, so two libraries both named `lib` would shadow each other.
# See docs/schemas/library.schema.yaml for the full schema.

apiVersion: mas/v1
kind: Library

name: lifecycle-control-lib
description: >
  Lab-local pipeline figure steps for lifecycle-control.lab. Not a shipped
  package; listed from lab-config.yaml as lifecycle_control_lab/.
version: "0.1.0"

types:
  - step

plugins:
  - type: step
    name: figure_call_counts
    module: lifecycle_control_lab.steps.figure_call_counts
    class: FigureCallCountsStep
  - type: step
    name: figure_governance_overhead
    module: lifecycle_control_lab.steps.figure_governance_overhead
    class: FigureGovernanceOverheadStep
  - type: step
    name: figure_precision_recall_detail
    module: lifecycle_control_lab.steps.figure_precision_recall_detail
    class: FigurePrecisionRecallDetailStep
  - type: step
    name: figure_moodbar_detail
    module: lifecycle_control_lab.steps.figure_moodbar_detail
    class: FigureMoodbarDetailStep
  - type: step
    name: figure_stacking_detail
    module: lifecycle_control_lab.steps.figure_stacking_detail
    class: FigureStackingDetailStep
  - type: step
    name: figure_per_call
    module: lifecycle_control_lab.steps.figure_per_call
    class: FigurePerCallStep
  - type: step
    name: figure_nonllm
    module: lifecycle_control_lab.steps.figure_nonllm
    class: FigureNonllmStep
  - type: step
    name: figure_trajectory_automaton
    module: lifecycle_control_lab.steps.figure_trajectory_automaton
    class: FigureTrajectoryAutomatonStep
  - type: step
    name: figure_trajectory_swimlane
    module: lifecycle_control_lab.steps.figure_trajectory_swimlane
    class: FigureTrajectorySwimlaneStep
  - type: step
    name: figure_trajectory_compact
    module: lifecycle_control_lab.steps.figure_trajectory_compact
    class: FigureTrajectoryCompactStep
  - type: step
    name: figure_trajectory_bw
    module: lifecycle_control_lab.steps.figure_trajectory_bw
    class: FigureTrajectoryBwStep
  - type: step
    name: figure_trajectory_paper
    module: lifecycle_control_lab.steps.figure_trajectory_paper
    class: FigureTrajectoryPaperStep
  - type: step
    name: figure_trajectory_bw_plot
    module: lifecycle_control_lab.steps.figure_trajectory_bw_plot
    class: FigureTrajectoryBwPlotStep
