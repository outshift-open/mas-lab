# Lab-local library for extensions.lab.
# The package name is unique across libraries: lab roots and library parents
# share one sys.path, so two libraries both named `lib` would shadow each other.
# `extensions_lab/memory/` is a helper package for Letta overlays, not a runtime plugin.
# See docs/schemas/library.schema.yaml for the full schema.

apiVersion: mas/v1
kind: Library

name: extensions-lib
description: >
  Lab-local pipeline steps and Letta memory helpers for extensions.lab.
  Not a shipped package; listed from lab-config.yaml as extensions_lab/.
version: "0.1.0"

types:
  - step

plugins:
  - type: step
    name: attribution_flow
    module: extensions_lab.steps.attribution_flow
    class: AttributionFlowStep
  - type: step
    name: eval_fact_recall
    module: extensions_lab.steps.eval_fact_recall
    class: EvalFactRecallStep
  - type: step
    name: figure_provenance_record
    module: extensions_lab.steps.figure_provenance_record
    class: FigureProvenanceRecordStep
  - type: step
    name: figure_recall_summary
    module: extensions_lab.steps.figure_recall_summary
    class: FigureRecallSummaryStep
  - type: step
    name: figure_smoke_evidence
    module: extensions_lab.steps.figure_smoke_evidence
    class: FigureSmokeEvidenceStep
  - type: step
    name: governance_overhead
    module: extensions_lab.steps.governance_overhead
    class: GovernanceOverheadStep
  - type: step
    name: sankey_flow
    module: extensions_lab.steps.sankey_flow
    class: SankeyFlowStep
