# MAS Library Metadata — Samples
# Declares sample apps, datasets, and tools bundled with this library.
# See docs/schemas/library.schema.yaml for the full schema.

apiVersion: mas/v1
kind: Library

name: mas-library-samples
description: >
  Community-contributed MAS sample applications, datasets, and tools for
  benchmarks, tutorials, and experimentation.
version: "0.0.2"

apps:
  trip-planner: apps/trip-planner
  trip-planner-topo-moderator-broker: apps/trip-planner/mas-topologies/moderator-broker.mas.yaml
  trip-planner-topo-parallel: apps/trip-planner/mas-topologies/parallel.mas.yaml
  trip-planner-topo-linear-pipeline: apps/trip-planner/mas-topologies/linear-pipeline.mas.yaml
  trip-planner-topo-supervised: apps/trip-planner/mas-topologies/supervised.mas.yaml
  trip-planner-topo-verifier: apps/trip-planner/mas-topologies/verifier.mas.yaml
  trip-planner-topo-single-agent: apps/trip-planner/mas-topologies/single-agent.mas.yaml
  qa-agent: apps/qa-agent

datasets:
  mas-necessity: datasets/generic/mas-necessity.yaml
  qa-reasoning-queries: datasets/generic/qa-reasoning-queries.yaml
  qa-reasoning-queries-100: datasets/generic/qa-reasoning-queries-100.yaml
  trip-planner-benchmark: datasets/trip-planner/benchmark.yaml
  trip-planner-benchmark-100: datasets/trip-planner/benchmark-100.yaml
  trip-planner-queries: datasets/trip-planner/queries.yaml

tools:
  web-search: tools/web-search.tool.yaml
  calc: tools/calc.tool.yaml
  memory-search: tools/memory-search.tool.yaml
