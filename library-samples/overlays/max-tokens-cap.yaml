# Cap per-call output tokens on the primary model — patches the same
# spec.models[].max_tokens field a manifest would set directly (named_list_merge
# upserts by id, default "main"). Compose onto any agent that omits max_tokens.
apiVersion: mas/v1
kind: Overlay
metadata:
  name: max-tokens-cap
spec:
  target:
    kind: Agent
  patch:
    models:
      - id: main
        max_tokens: 4096
