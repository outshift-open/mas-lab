api_version: pipeline/v1
kind: Pipeline
metadata:
  name: trip-planner-cot-analysis
spec:
  output:
    base_dir: ~/.local/share/mas/labs/trip-planner-cot-check
  steps:
    - name: plot-multilevel-trajectory
      type: plot_multilevel_trajectory
      x-node-id: pnode_0e04dc37
      depends_on:
        - extract-trajectories
      config:
        format: html
        title: MAS Multilevel Trajectory
        width_mode: log
        show_user_actors: true
        filename: multilevel_trajectory
    - name: extract-trajectories
      type: extract_trajectories
      x-node-id: pnode_dfeee58a
      config:
        csv_file: results.csv
        runs_dir: runs
        overwrite: false
x-canvas-positions:
  pnode_0e04dc37:
    x: 704
    y: 64
  pnode_dfeee58a:
    x: 208
    y: 192
