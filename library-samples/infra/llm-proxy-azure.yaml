apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: openai-proxy-azure
  description: >
    standard:llm-proxy plus a mapping from bare OpenAI model names to the
    azure/* names served by an Azure-backed LiteLLM gateway.

spec:
  protocol: openai
  proxy:
    api_base: env:LLM_PROXY_API_BASE|https://api.openai.com/v1
    api_key_env: env:LLM_PROXY_API_KEY_ENV|OPENAI_API_KEY

  models:
    mappings:
      gpt-4o: azure/gpt-4o
      gpt-4o-mini: azure/gpt-4o-mini
    allowed:
      - azure/gpt-4o
      - azure/gpt-4o-mini
    defaults:
      embed: text-embedding-3-small
