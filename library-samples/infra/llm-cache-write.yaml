apiVersion: infra/v1
kind: InfraMiddleware

metadata:
  name: llm-cache-write
  description: >
    Write-only LLM cache middleware. Records every LLM_CALL to cache_path while
    still calling the provider on a miss. See docs/manifests/llm-cache.md.

spec:
  middleware: llm_cache
  applies_to:
    - LLM_CALL
  params:
    allow_read: false
    allow_write: true
    raise_on_miss: false
    cache_path: library-samples/infra/cache/demo.llm-cache.json
