apiVersion: infra/v1
kind: ToolServerRegistry
metadata:
  name: mixed-local-mcp-tools
  description: Route discovered MCP tools remotely and keep remaining tools local.
spec:
  tool_servers:
    - id: local-tools
      protocol: local
      tools: "*"
    - id: mcp-web-search
      protocol: mcp
      usage: use
      transport: streamable-http
      url: http://127.0.0.1:9001/mcp
      tools: "*"
