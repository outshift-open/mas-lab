apiVersion: infra/v1
kind: Application
metadata:
  name: mixed-local-a2a-agents
  description: Route schedule_agent through A2A and keep remaining agents local.
spec:
  endpoints:
    schedule_agent:
      protocol: a2a
      usage: use-and-deploy
      url: http://127.0.0.1:9006
