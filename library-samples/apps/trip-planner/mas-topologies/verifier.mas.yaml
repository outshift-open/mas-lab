apiVersion: mas/v1
kind: MAS
metadata:
  name: trip-planner-verifier
  description: >
    Trip Planner MAS with verifier-style topology. itinerary_agent proposes,
    schedule_agent verifies claims, moderator reconciles.
spec:
  agency:
    agents:
      - id: concierge_agent
        ref: ../agents/concierge_agent.yaml
      - id: itinerary_agent
        ref: ../agents/itinerary_agent.yaml
      - id: moderator
        ref: ../agents/moderator.yaml
      - id: schedule_agent
        ref: ../agents/schedule.yaml
  workflow:
    entry: moderator
    nodes:
      - id: moderator
        delegates_to:
          - itinerary_agent
          - schedule_agent
      - id: itinerary_agent
      - id: schedule_agent
