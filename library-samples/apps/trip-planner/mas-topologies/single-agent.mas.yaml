apiVersion: mas/v1
kind: MAS
metadata:
  name: trip-planner-single-agent
  description: >
    Trip Planner single-agent topology. Uses a generalist agent with all tools,
    no delegation graph.
spec:
  agency:
    agents:
      - id: generalist
        ref: ../agents/generalist/agent.yaml
  workflow:
    entry: generalist
    nodes:
      - id: generalist
