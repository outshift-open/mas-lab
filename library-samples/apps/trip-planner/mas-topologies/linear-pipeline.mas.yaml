apiVersion: mas/v1
kind: MAS
metadata:
  name: trip-planner-linear-pipeline
  description: >
    Trip Planner MAS with deterministic linear chain:
    schedule_agent -> itinerary_agent -> concierge_agent.
spec:
  agency:
    agents:
      - id: concierge_agent
        ref: ../agents/concierge_agent.yaml
      - id: itinerary_agent
        ref: ../agents/itinerary_agent.yaml
      - id: moderator
        ref: ../agents/moderator.yaml
      - id: schedule_agent
        ref: ../agents/schedule.yaml
  workflow:
    entry: schedule_agent
    nodes:
      - id: schedule_agent
        delegates_to: [itinerary_agent]
      - id: itinerary_agent
        delegates_to: [concierge_agent]
      - id: concierge_agent
