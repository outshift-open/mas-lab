apiVersion: mas/v1
kind: MAS
metadata:
  name: trip-planner-moderator-broker
  description: >
    Trip Planner MAS with moderator-broker topology. Moderator dynamically
    delegates to all specialists in sequence.
spec:
  agency:
    agents:
      - id: concierge_agent
        ref: ../agents/concierge_agent.yaml
      - id: itinerary_agent
        ref: ../agents/itinerary_agent.yaml
      - id: moderator
        ref: ../agents/moderator.yaml
      - id: schedule_agent
        ref: ../agents/schedule.yaml
  workflow:
    entry: moderator
    nodes:
      - id: moderator
        delegates_to:
          - schedule_agent
          - itinerary_agent
          - concierge_agent
      - id: schedule_agent
      - id: itinerary_agent
      - id: concierge_agent
