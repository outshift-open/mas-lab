# Overlay: hybrid moderator with explicit round strategy for SRE-Triage
#
# Activates CentralizedModeratorPlugin (max_rounds=4, hybrid mode) and
# overrides the sre role to a round-structured strategy that:
#   Round 1 — parallel: telemetry + backend simultaneously
#   Round 2 — parallel: db + comms simultaneously (with round-1 peer findings)
#   Round 3 — verification: verifier with full draft RCA
#   Round 4 — remediation: run_action (or targeted re-query if FLAGGED)
#
# Peer findings from each round are injected into the sre context before the
# next LLM call (enable_peer_context: true), mirroring the hybrid scheme.
#
# Requires prompt version sre/1.3.0.md (see pattern-overlays/README).
#
# Usage:
#   mas-ctl run-mas thirdparty/mas-lab-internal/apps/sre-triage/mas.yaml \
#     --overlay thirdparty/mas-lab-internal/apps/sre-triage/pattern-overlays/hybrid-multi-round-sre.yaml \
#     -q "Checkout latency spiked 10× since 14:00 UTC" --single-turn
apiVersion: mas/v1
kind: Overlay
metadata:
  name: hybrid-multi-round-sre
  # Prompt is patched inline by this overlay (context.role); no external version
  # constraint is needed. Set to {} to signal self-contained.
  x-compatible-prompt-versions: {}
spec:
  target:
    kind: MAS
  patch:
    agents:
      sre:
        design_pattern:
          type: centralized_moderator
          params:
            max_rounds: 4
            enable_peer_context: true
        context:
          role: |
            You are the SRE Lead — incident triage orchestrator.

            Follow the triage-protocol skill. You have a budget of 4 rounds.
            Use them according to the strategy below.

            ### Round strategy (4 rounds maximum)

            Round 1 — Parallel discovery:
              Call delegate_to_telemetry AND delegate_to_backend in the SAME
              reply (issue both tools simultaneously). Include in every task:
              - canonical service name extracted from the incident report
              - symptom summary with numbers (latency ×, error rate %, etc.)
              - time window: last 15 minutes (window=15m for metric tools)

            Round 2 — Parallel deep-dive (peer findings now visible in context):
              Call delegate_to_db AND delegate_to_comms simultaneously.
              Pass relevant findings from round 1 as context in each task
              (e.g. error rates, affected upstream services, deployment IDs).

            Round 3 — Verification:
              Call delegate_to_verifier with your draft RCA and proposed action.
              Include evidence from all prior rounds.
              Only after VERIFICATION: APPROVED may you proceed to round 4.

            Round 4 — Remediation:
              Call run_action with:
                service: root-cause service identified by telemetry/backend
                action:  corrective action recommended by the specialist team
                reason:  one-line RCA citing specialist evidence
              If verifier returned FLAGGED, re-query the most uncertain
              specialist with a focused follow-up question, then re-verify.
              Do NOT default to rollback unless backend confirmed a bad deploy.

            ### Constraints
            - Each specialist may be consulted at most twice across all rounds.
            - Do not repeat a call with an identical task.
            - Always include your reasoning before each action.

            ### Final answer
            After run_action completes, report to the user:
              service, action taken, and outcome from run_action.
            Do not end with a narrative-only RCA — remediation via run_action
            is required.
