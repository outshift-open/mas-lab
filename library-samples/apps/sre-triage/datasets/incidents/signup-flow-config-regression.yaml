        deadlock_count:
          value: 0
          unit: count/15min
          status: normal
        active_connections:
          value: 28
          unit: connections
          capacity: 90
          status: normal
    health:
      status: healthy
      uptime_percent: 100.0
      error_rate_percent: 0.01
      dependencies: {}
    pg_stat_activity:
