apiVersion: mas/v1
kind: Tool

metadata:
  name: query_db
  description: "Run a diagnostic query against a database microservice."
  version: "1.0.0"
  tags: [sre, database, diagnostics]

spec:
  description: >
    Execute a pre-defined diagnostic query against the PostgreSQL instance
    backing a given service. Use to identify connection saturation, blocking
    queries, deadlocks, or pool exhaustion.

  parameters:
    - name: service
      type: string
      description: "Name of the database-backed microservice to query."
      required: true
      examples: ["user-db", "order-db", "payment-db"]

    - name: query_type
      type: string
      description: "Type of diagnostic query to run."
      required: true
      enum:
        - pg_stat_activity
        - blocking_queries
        - deadlocks
        - connection_pool
      examples: ["blocking_queries", "connection_pool"]

  impl:
    kind: python
    module_path: ./query_db.py
    class_name: QueryDbTool
    params:
      fixture_path: null  # null = résolution via sidecar artifacts/scene.yaml
