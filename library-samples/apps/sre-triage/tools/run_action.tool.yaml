apiVersion: mas/v1
kind: Tool

metadata:
  name: run_action
  description: "Execute a remediation action on a microservice."
  version: "1.0.0"
  tags: [sre, remediation, actions]

spec:
  description: >
    Trigger a remediation or operational action on a given microservice.
    Actions are idempotent in simulation mode. Always provide a reason
    describing why the action is being taken for audit purposes.

  parameters:
    - name: service
      type: string
      description: "Name of the microservice on which to perform the action."
      required: true
      examples: ["payment-api", "auth-service", "order-processor"]

    - name: action
      type: string
      description: "Remediation action to execute."
      required: true
      enum:
        - restart
        - scale_up
        - scale_down
        - rollback
        - clear_cache
        - toggle_circuit_breaker
        - drain_traffic
        - enable_debug_logging
        - run_health_check
        - notify_on_call
      examples: ["restart", "rollback", "scale_up"]

    - name: reason
      type: string
      description: >
        Human-readable justification for the action.
        Recorded in the audit log. Strongly recommended.
      required: false

  impl:
    kind: python
    module_path: ./run_action.py
    class_name: RunActionTool
    params:
      fixture_path: null  # null = résolution via sidecar artifacts/scene.yaml
