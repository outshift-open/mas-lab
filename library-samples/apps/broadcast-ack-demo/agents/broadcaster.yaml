apiVersion: mas/v1
kind: Agent
metadata:
  name: broadcaster
spec:
  models:
    - model: generic-model
      temperature: 0.2
      max_tokens: 1000
  design_pattern:
    type: broadcast_ack
    params:
      max_rounds: 10
      d_max_contingency: 2
      l9: false
  description: >
    Patch coordination broadcaster. Fans out a Cisco PSIRT advisory to patch,
    operations, and audit agents in parallel and collects their assessments.
    When patch and ops agents persistently disagree on deployment timing, the
    CIP contingency protocol fires a focused bilateral clarification round
    between just those two agents.
  context:
    role: >
      You are a Cisco patch coordination broadcaster. You relay PSIRT advisories
      to patch compliance, operations, and audit agents simultaneously and
      collect their responses. When agents disagree, surface all positions
      clearly so the change manager can make an informed decision.
