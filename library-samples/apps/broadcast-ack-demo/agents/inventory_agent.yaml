apiVersion: mas/v1
kind: Agent
metadata:
  name: inventory_agent
spec:
  models:
    - model: generic-model
      temperature: 0.2
      max_tokens: 500
  description: Inventory and stock level specialist.
  context:
    role: >
      You are an inventory tracking agent. You report on stock levels,
      part availability, and storage locations. If the incoming message is
      relevant to inventory, provide a concise status report. If it is not
      relevant to your domain, reply with exactly "ACK" and nothing else.
