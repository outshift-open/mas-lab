# Canonical config.yaml — copy to your project root as config.yaml.
#
# Global fallback: $XDG_CONFIG_HOME/mas/config.yaml
# Project override: <project-root>/config.yaml (highest precedence)
# Checkout dev: export MAS_WORKSPACE_ROOT=library-samples/sample-workspace
#
# For live OpenAI/production infra, see:
#   docs/tutorials/00-environment-setup/config.openai.example.yaml
#
# For live LLM via proxy: set MAS_INFRA_REFS=standard:llm-proxy and
# LLM_PROXY_API_BASE=https://your-proxy/v1 in .env (see tutorial 00).

mas_ctl:
  flavour: local
  env: .env
  # Human exchange log on stderr. Machines use events.jsonl / telemetry.
  trace: summary

mas_lab:
  flavour: local
  benchmark_flavour: local-benchmark

# OSS dev / CI: set default_infra in user config (Tutorial 0) or:
#   infra_refs: [standard:openai]
# Offline replay: pair with tests/fixtures/llm-cache/ci-replay.yaml
# infra_refs:
#   - standard:openai

# Optional shared runtime tuning (omit to use package defaults only):
# runtime_refs:
#   - standard:runtime-default
#   - runtime/local.yaml

# Optional extra library search paths (folders, not an alias table).
# Each entry is a library root or a parent of sibling library folders.
# library.yaml in those folders fills the catalog. Same idea as lab.libraries
# and MAS_LIBRARY_PATHS. Install remains the other door (entry point).
# manifest_libraries:
#   - .
#   - ./libraries

# Overlay plugins — gdb and checkpoint stores. Off unless listed.
# Uncomment the key and any line to enable.
# Labs may enable the same URNs under lab.enable_plugins.
# plugins:
#   - mas.runtime.debug_script             # gdb breakpoints
#   - mas.checkpoint_store.hybrid          # persist to memory and disk
#   - mas.checkpoint_store.disk            # JSON files
#   - mas.checkpoint_store.memory          # in-process map
#   - mas.control_protocol.rpc             # JSON-lines ControlContract wire
