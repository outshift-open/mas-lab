apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: openai-direct
  description: OpenAI-compatible API (example workspace).

spec:
  proxy:
    api_base: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY

  models:
    mappings:
      # Apps can reference model: default instead of a provider-specific name.
      default: gpt-4o-mini
    allowed:
      - gpt-4o
      - gpt-4o-mini
    defaults:
      llm: default
