# IOA library — MCP tool-provider plugin for MAS Lab.
apiVersion: mas/v1
kind: Library

name: library-ioa
description: >
  MCP client/server bridge. Registers kind: mcp as a tool-provider plugin.
version: "0.1.0"
dependencies:
  - mas-runtime
  - mcp>=2.2

module_base: library_ioa

types:
  - tool_provider
  - agent_comm
  - agent_expose
  - webserver

plugins:
  - type: tool_provider
    name: mcp
    urn: mas.tool_provider.mcp
    module: library_ioa.plugins.mcp.provider
    class: MCPToolProvider
    shortcuts:
      - mcp
  - type: agent_comm
    name: a2a
    urn: mas.agent_comm.a2a
    module: library_ioa.plugins.a2a.agent_comm
    class: A2AAgentComm
  - type: agent_expose
    name: a2a
    urn: mas.agent_expose.a2a
    module: library_ioa.plugins.a2a.exposure
    class: A2AExposure
  - type: webserver
    name: uvicorn
    urn: mas.webserver.uvicorn
    module: library_ioa.plugins.webserver
    class: UvicornWebServer
