[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "library-ioa"
version = "0.1.0"
description = "MCP client/server bridge for MAS Lab"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mcp>=1.0",
]

[project.scripts]
mas-mcp = "library_ioa.plugins.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/library_ioa"]

[tool.uv.sources]
