apiVersion: mas/v1
kind: LlmModelCatalog
metadata:
  name: standard
  version: "2026.9.2"
  description: >
    Curated per-model defaults, maxima, and allowed settings. Not a vendor dump.
    Refresh from the sources below; keep this file versioned in git.

spec:
  sources:
    - id: litellm
      title: LiteLLM model_prices_and_context_window
      url: https://github.com/BerriAI/litellm/blob/main/model_prices_and_context_window.json
      reusable: true
      note: >
        De facto community table of context windows, max output, and mode
        support. MIT. Too large to vendor; we curate a subset and would
        wrap this JSON behind mas.runtime.engine.llm_model_catalog if we
        publish the catalog as its own library.
    - id: openrouter
      title: OpenRouter models API
      url: https://openrouter.ai/api/v1/models
      reusable: false
      note: Live HTTP catalogue (context_length, pricing, supported_parameters).
    - id: huggingface
      title: Hugging Face model cards (TGI / text-generation)
      url: https://huggingface.co/models
      reusable: false
    - id: vllm
      title: vLLM engine args / chat_template_kwargs
      url: https://docs.vllm.ai/en/latest/serving/openai_compatible_server.html
      reusable: false
      note: think / chat_template_kwargs.enable_thinking for local reasoning models.
    - id: ollama
      title: Ollama think parameter
      url: https://github.com/ollama/ollama/blob/main/docs/api.md
      reusable: false
    - id: models-dev
      title: models.dev community catalog
      url: https://models.dev
      reusable: false
      note: >
        Aggregated context windows and provider metadata used by several
        coding agents. HTTP/JSON, not a Python library we can import.
    - id: aider
      title: Aider MODEL_SETTINGS
      url: https://github.com/Aider-AI/aider/blob/main/aider/resources/model-settings.yml
      reusable: false
      note: Per-model edit_format / weak_model tables. Aider-specific, not importable as an API.
    - id: continue
      title: Continue.dev model configs
      url: https://github.com/continuedev/continue
      reusable: false
    - id: openclaw
      title: OpenClaw MAS extract (historical pointer)
      reusable: false
      note: >
        Git history in this repo moved OpenClaw plugins (semantic memory,
        telemetry SpanSpec) into library-standard / mas-lab-otel. A reusable
        model-capability table was never checked in here. Keep the pointer
        so a later refresh can re-import context sizes if that extract is
        located outside this tree.

  models:
    gpt-4o:
      aliases: [openai/gpt-4o, azure/gpt-4o]
      context_window: 128000
      max_output_tokens: 16384
      apis: [chat_completions]
      defaults:
        temperature: 0.7
      settings:
        temperature: {min: 0, max: 2, default: 0.7}
        reasoning.effort: {supported: false}
        reasoning.mode: {supported: false}
        think: {supported: false}
        reasoning.exclude: {supported: false}

    gpt-4o-mini:
      aliases: [openai/gpt-4o-mini, azure/gpt-4o-mini]
      context_window: 128000
      max_output_tokens: 16384
      apis: [chat_completions]
      defaults:
        temperature: 0.7
      settings:
        temperature: {min: 0, max: 2, default: 0.7}
        reasoning.effort: {supported: false}
        reasoning.mode: {supported: false}
        think: {supported: false}
        reasoning.exclude: {supported: false}

    gpt-5:
      aliases: [openai/gpt-5, gpt-5-chat-latest]
      context_window: 400000
      max_output_tokens: 128000
      apis: [chat_completions, responses]
      defaults:
        temperature: 1.0
        reasoning.effort: medium
      settings:
        temperature: {min: 0, max: 2, default: 1.0}
        reasoning.effort: {enum: [none, minimal, low, medium, high, xhigh], default: medium}
        reasoning.mode: {enum: [standard, pro], supported: true}
        reasoning.exclude: {supported: false}
        think: {supported: false}
        include: {supported: true}

    gpt-5-mini:
      aliases: [openai/gpt-5-mini]
      context_window: 400000
      max_output_tokens: 128000
      apis: [chat_completions, responses]
      defaults:
        reasoning.effort: low
      settings:
        reasoning.effort: {enum: [none, minimal, low, medium, high], default: low}
        reasoning.mode: {enum: [standard, pro]}
        reasoning.exclude: {supported: false}
        think: {supported: false}

    gemini-2.5-pro:
      aliases: [vertex_ai/gemini-2.5-pro, gemini/gemini-2.5-pro]
      context_window: 1048576
      max_output_tokens: 65536
      max_thinking_tokens: 32768
      apis: [chat_completions, gemini]
      defaults:
        reasoning.budget_tokens: 1024
      settings:
        reasoning.budget_tokens: {min: 0, max: 32768}
        reasoning.effort: {enum: [none, low, medium, high]}
        think: {supported: false}
        reasoning.max_completion_tokens: {supported: false}

    gemini-2.5-flash:
      aliases: [vertex_ai/gemini-2.5-flash]
      context_window: 1048576
      max_output_tokens: 65536
      max_thinking_tokens: 24576
      apis: [chat_completions, gemini]
      settings:
        reasoning.budget_tokens: {min: 0, max: 24576}
        reasoning.effort: {enum: [none, low, medium, high]}
        reasoning.mode: {supported: false}
        reasoning.exclude: {supported: false}
        think: {supported: false}
        include: {supported: false}
        reasoning.max_completion_tokens: {supported: false}

    gemma-4-26b-a4b-it-node1-a100-0:
      aliases: [gemma-4-26b, gemma4, onprem/gemma4]
      context_window: 131072
      max_output_tokens: 8192
      apis: [chat_completions, vllm]
      defaults:
        temperature: 0.7
        think.chat_template_kwargs: true
      settings:
        think: {supported: true}
        reasoning.effort: {supported: false}
        reasoning.mode: {supported: false}
        reasoning.exclude: {supported: false}
        reasoning.max_completion_tokens: {supported: false}

    llama3.2:
      aliases: [llama3.2:latest]
      context_window: 131072
      max_output_tokens: 8192
      apis: [chat_completions, ollama]
      settings:
        think: {enum: [false, true, low, medium, high]}
        reasoning.effort: {enum: [none, low, medium, high]}
        reasoning.max_completion_tokens: {supported: false}

    gpt-oss:
      aliases: [openai/gpt-oss, gpt-oss-120b]
      context_window: 131072
      max_output_tokens: 32768
      apis: [chat_completions, vllm]
      defaults:
        think.chat_template_kwargs: true
      settings:
        think: {supported: true}
        reasoning.effort: {enum: [low, medium, high]}
        reasoning.exclude: {supported: false}
        reasoning.max_completion_tokens: {supported: false}
