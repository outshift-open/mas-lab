# Live MasOtelPlugin spans → KG (kg_otel_plugin).
apiVersion: mas/v1
kind: Pipeline

metadata:
  name: observability-otel-plugin-to-kg
  description: Verify live otel_sdk_spans.jsonl, normalize to kg_otel_plugin.

spec:
  steps:
    - name: verify-otel-plugin-spans
      type: verify_otel
      per_run: true
      config:
        spans_filename: otel_sdk_spans.jsonl
        fail_on_error: true
        spanspec_level: L3
        spanspec_strictness: required

    - name: normalize-otel-plugin
      type: normalize_otel
      per_run: true
      depends_on: [verify-otel-plugin-spans]
      config:
        filename: otel_sdk_spans.jsonl

    - name: normalize-otel-plugin-kg
      type: normalize_events
      per_run: true
      depends_on: [normalize-otel-plugin]
      config:
        artifact: kg_otel_plugin

    - name: validate-otel-plugin-kg
      type: validate_kg
      per_run: true
      depends_on: [normalize-otel-plugin-kg]
      config:
        fail_on_error: true
        strict: false
