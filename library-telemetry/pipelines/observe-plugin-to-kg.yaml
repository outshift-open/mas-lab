# Live ObserveSDKPlugin spans → KG (kg_observe).
apiVersion: mas/v1
kind: Pipeline

metadata:
  name: observability-observe-plugin-to-kg
  description: Verify live observe_sdk_spans.jsonl, normalize to kg_observe.

spec:
  steps:
    - name: verify-observe-plugin-spans
      type: verify_otel
      per_run: true
      config:
        spans_filename: observe_sdk_spans.jsonl
        fail_on_error: true
        spanspec_level: L3
        spanspec_strictness: required

    - name: normalize-observe-plugin
      # observe-sdk spans are OTel spans — normalize_otel auto-detects the
      # format (openclaw / ioa_observe), so there is no separate observe step.
      type: normalize_otel
      per_run: true
      depends_on: [verify-observe-plugin-spans]
      config:
        filename: observe_sdk_spans.jsonl

    - name: normalize-observe-plugin-kg
      type: normalize_events
      per_run: true
      depends_on: [normalize-observe-plugin]
      config:
        artifact: kg_observe

    - name: validate-observe-plugin-kg
      type: validate_kg
      per_run: true
      depends_on: [normalize-observe-plugin-kg]
      config:
        fail_on_error: true
        strict: false
