# Native events → OTel span JSONL (offline replay, no collector).
apiVersion: mas/v1
kind: Pipeline

metadata:
  name: telemetry-native-to-otel-json
  description: MasOtelConverter replay from events.jsonl to otel_sdk_spans_replay.jsonl.

spec:
  steps:
    - name: events-to-otel-replay
      type: events_to_otel
      per_run: true
      config:
        service_name: mas-runtime
        output_filename: otel_sdk_spans_replay.jsonl
        converter_profile: observe_sdk
        # Categories (same as CLI --layer / --governance):
        # export_layers:
        #   structure: true
        #   execution: true
        #   semantic: true
        #   provenance: true
        #   governance: false
        # realtime: false
        # replay_speed: 0   # instant; 1 = original timestamps; 2 = 2x

    - name: verify-otel-replay
      type: verify_otel
      per_run: true
      depends_on: [events-to-otel-replay]
      config:
        fail_on_error: true
        spanspec_level: L3
        spanspec_strictness: required
