#
# Local Neo4j for KG file → graph serialization. Auth is disabled for a
# laptop lab; set NEO4J_AUTH in the environment for anything else.
#
# Full OXP (norm worker, API, RabbitMQ, UI) is not published as a single
# image. Clone observe-and-explain-platform and use backend/docker-compose.yml.
#
#   docker compose -f library-kg/docker/compose.yaml up -d
#   export NEO4J_URI=bolt://localhost:7687
name: mas-kg

services:
  neo4j:
    image: neo4j:5.26
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: none
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
