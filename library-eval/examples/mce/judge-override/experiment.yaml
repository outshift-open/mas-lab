# Feature example for experiment.models slots and eval_mce config.model.
# Not a sample app. validate-only unless you point applications at a real MAS.
experiment:
  name: judge-override
  description: "Pin turn vs judge via experiment.models; per-step config.model still wins."
  models:
    main: gpt-4o
    judge: gpt-4o-mini
  application:
    manifest: ./mas.yaml
  evaluation:
    method: llm_judge
  post:
    - type: extract_trajectories
    - type: eval_mce
      depends_on: [extract_trajectories]
    - type: eval_mce
      name: eval_mce_strict
      depends_on: [extract_trajectories]
      config:
        model: gpt-4o
        max_workers: 2
        fail_threshold: 0.5
        metrics:
          - goal_success_rate
          - answer_relevancy
