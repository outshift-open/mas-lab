# MAS Library Metadata — Eval
#
# Declares the eval_metric plugin type and a toy metric used by tests and docs.
# Libraries register metrics onto the MCE eval provider.

apiVersion: mas/v1
kind: Library

name: mas-library-eval
description: >
  Evaluation metrics and LLM-as-judge scoring. Hosts the eval_metric plugin
  type so other libraries can register session metrics onto an eval provider.
version: "0.2.0"

module_base: mas.library.eval

types:
  - eval_metric

plugins:
  - type: eval_metric
    name: toy_echo
    module: mas.library.eval.metrics.toy
    class: ToyEchoMetric
    description: Example session metric that scores 1.0 when a native trace exists.
    attributes:
      provider: mce
