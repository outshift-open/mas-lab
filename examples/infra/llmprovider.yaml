# Canonical infra sample leveraged by `mas-lab init`.
apiVersion: infra/v1
kind: LLMProxy

metadata:
  name: __INFRA_NAME__
  description: Default LLM provider created by mas-lab init.

spec:
  proxy:
    api_base: __API_BASE_URL__
    api_key_env: __API_KEY_ENV__

  models:
    mappings:
      # Stable alias used in agent manifests.
      __MODEL_ALIAS__: __TARGET_MODEL__
