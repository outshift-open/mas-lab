# Overlay — adds the answer-expert skill. Listing spec.skills is enough:
# activate_skill is injected as a system tool; the catalog lists frontmatter.
#
# Explicit alternative (same effect):
#   tools:
#     - kind: system
#       name: activate_skill
apiVersion: mas/v1
kind: Overlay

metadata:
  name: with-skills

spec:
  target:
    kind: Agent
  patch:
    skills:
      $op:
        add:
          - answer-expert
