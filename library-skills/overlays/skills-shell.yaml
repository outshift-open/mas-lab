# Skills + shell overlay — adds all skill tools including run_skill_script.
# Only enable in trusted environments where skill scripts have been reviewed.
#
# Usage:
#   mas-ctl chat agents/my-agent.yaml \
#     -o pkg://skills/overlays/skills-shell.yaml

apiVersion: mas/v1
kind: Overlay
metadata:
  name: skills-shell
spec:
  target:
    kind: Agent
  patch:
    spec:
      tools:
        - $append:
          - ref: "pkg://skills/tools/skill-access.tool.yaml"
          - ref: "pkg://skills/tools/run-skill-script.tool.yaml"
