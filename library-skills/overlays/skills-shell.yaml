# Skills + shell overlay — explicit opt-in for run_skill_script.
# Implicit when a listed skill already has a scripts/ directory.
#
# Usage:
#   mas-ctl chat agents/my-agent.yaml \
#     -o pkg://skills/overlays/skills-shell.yaml

apiVersion: mas/v1
kind: Overlay
metadata:
  name: skills-shell
spec:
  target:
    kind: Agent
  patch:
    spec:
      tools:
        - $append:
          - kind: system
            name: activate_skill
          - kind: system
            name: run_skill_script
