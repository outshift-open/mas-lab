[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mas-library-skills"
version = "0.1.0"
description = "Skills library for MAS — ContextContract catalog plugin + ToolContract skill-access tools."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "mas-runtime",
    "pyyaml>=6.0,<7.0",
    "python-frontmatter>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
# The default "native" engine uses the bundled agentskills.io parser and skill
# sandbox. The adk and langchain engines wrap third-party frameworks and are opt-in.
#
# Upper bounds are deliberate: these frameworks float their own transitive pins
# (google-adk 2.7 moved opentelemetry-sdk to >=1.39) and a new major silently
# breaks workspace resolution. Bump a bound explicitly after verifying
# `uv lock` and tests/test_skill_plugins_functional.py.
adk = [
    "google-adk>=1.0.0,<3.0.0",
]
langchain = [
    "deepagents>=0.7.0,<1.0.0",
]
# Every engine — needed to run tests/test_skill_plugins_functional.py against
# the real frameworks rather than mocks.
all = [
    "google-adk>=1.0.0,<3.0.0",
    "deepagents>=0.7.0,<1.0.0",
]

[project.entry-points."mas.runtime.manifest_libraries"]
skills = "mas.library.skills"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = [
    "src/mas",
    "src/agentskills",
    "src/sandbox",
]

[tool.hatch.build.targets.wheel.force-include]
"library.yaml" = "mas/library/skills/library.yaml"
"overlays/skills.yaml" = "mas/library/skills/overlays/skills.yaml"
"overlays/skills-shell.yaml" = "mas/library/skills/overlays/skills-shell.yaml"
