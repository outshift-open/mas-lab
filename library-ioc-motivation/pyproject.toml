[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mas-library-ioc-motivation"
version = "0.1.0"
description = "IoC cognitive-challenge reproduction as native MAS-Lab experiments + pipeline steps."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "MAS Framework Contributors"}]
dependencies = [
    "mas-lab",
]

# Registers the library's plugin manifest with the runtime registry so the two
# custom step types (ioc_cognitive_eval, ioc_delta) are discoverable.
[project.entry-points."mas.runtime.manifest_libraries"]
ioc_motivation = "mas.library.ioc_motivation"

[tool.hatch.build.targets.wheel]
packages = ["src/mas"]

[tool.hatch.build.targets.wheel.force-include]
"library.yaml" = "mas/library/ioc_motivation/library.yaml"
