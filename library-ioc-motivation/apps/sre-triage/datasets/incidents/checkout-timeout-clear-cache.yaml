id: checkout-timeout-clear-cache
description: >
  Checkout timeout symptoms are dominated by stale route and auth-token cache
  entries after a backend schema drift event.
timestamp: "2026-07-22T09:00:00"
correct_action:
  service: checkout-service
  action: clear_cache
  reasoning: >
    Timeout spikes are tied to stale cached dependency metadata and expired route
    mappings, while origin services are healthy. Clearing cache forces fresh reads
    and removes invalid entries faster than restart or rollback.
source_evidence:
  - source: google_sre_handling_overload
    url: https://sre.google/sre-book/handling-overload/
    facts:
      - Degraded responses can mask root issues while preserving availability.
      - Local resource signals should guide remediation, not only error count.
  - source: aws_timeouts_retries_backoff_jitter
    url: https://builder.aws.com/content/3EumjoZascWd1oZiEgL8ORlv3qE/timeouts-retries-and-backoff-with-jitter
    facts:
      - Long waits consume threads and connection resources.
      - Retry behavior around stale dependency state can increase burst pressure.
observed_symptoms:
  - Timeouts are concentrated on cache-hit paths with outdated dependency metadata.
  - Bypassing cache reduces timeout rate from 19% to 1.5% in canary traffic.
  - No recent deployment or worker crash pattern is observed.
