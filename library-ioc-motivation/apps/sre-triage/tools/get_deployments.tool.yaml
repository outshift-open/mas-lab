apiVersion: mas/v1
kind: Tool

metadata:
  name: get_deployments
  description: "List recent deployment history for a microservice."
  version: "1.0.0"
  tags: [sre, deployments, change-management]

spec:
  description: >
    Retrieve the recent deployment history for a microservice.
    Includes version, timestamp, status, and rollback eligibility.
    Use to correlate incidents with recent code changes.

  parameters:
    - name: service
      type: string
      description: "Name of the microservice to inspect."
      required: true
      examples: ["payment-api", "auth-service", "order-processor"]

    - name: limit
      type: integer
      description: "Maximum number of deployments to return. Defaults to 5."
      required: false

    - name: window
      type: string
      description: >
        Optional time filter — only return deployments within this window
        (e.g. '24h', '7d'). When omitted, returns the most recent deployments.
      required: false
      examples: ["24h", "7d"]

  impl:
    kind: python
    module_path: ./get_deployments.py
    class_name: GetDeploymentsTool
    params:
      fixture_path: null  # null = résolution via sidecar artifacts/scene.yaml
