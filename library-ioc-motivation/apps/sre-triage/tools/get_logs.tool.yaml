apiVersion: mas/v1
kind: Tool

metadata:
  name: get_logs
  description: "Retrieve recent log entries for a microservice."
  version: "1.0.0"
  tags: [sre, logs, observability]

spec:
  description: >
    Fetch recent log entries for a given microservice, optionally filtered
    by log level. Use to investigate errors, exceptions, or unexpected behaviour.

  parameters:
    - name: service
      type: string
      description: "Name of the microservice whose logs to retrieve."
      required: true
      examples: ["payment-api", "auth-service", "order-processor"]

    - name: level
      type: string
      description: "Minimum log level to return. Defaults to all levels."
      required: false
      enum: ["DEBUG", "INFO", "WARN", "ERROR"]
      examples: ["ERROR", "WARN"]

    - name: limit
      type: integer
      description: "Maximum number of log lines to return. Capped at 50."
      required: false

  impl:
    kind: python
    module_path: ./get_logs.py
    class_name: GetLogsTool
    params:
      fixture_path: null  # null = résolution via sidecar artifacts/scene.yaml
