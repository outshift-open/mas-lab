apiVersion: mas/v1
kind: Tool

metadata:
  name: get_service_health
  description: "Check the health status of a microservice."
  version: "1.0.0"
  tags: [sre, health, monitoring]

spec:
  description: >
    Retrieve the current health status of a microservice.
    Returns availability, latency, error rate, and dependency states.
    Use this tool to determine if a service is degraded or unhealthy.

  parameters:
    - name: service
      type: string
      description: "Name of the microservice to inspect."
      required: true
      examples: ["payment-api", "auth-service", "order-processor"]

    - name: include_dependencies
      type: boolean
      description: >
        When true, also returns health status for all upstream dependencies
        of the target service.
      required: false

  impl:
    kind: python
    module_path: ./get_service_health.py
    class_name: GetServiceHealthTool
    params:
      fixture_path: null  # null = résolution via sidecar artifacts/scene.yaml
