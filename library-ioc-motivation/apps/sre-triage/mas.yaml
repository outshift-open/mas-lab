apiVersion: mas/v1
kind: MAS
metadata:
  name: sre-triage
  description: I triage production incidents. Describe an outage, latency spike,
    or error-rate anomaly and I will coordinate specialist agents to produce a
    root-cause analysis and a verified remediation plan.
spec:
  agency:
    agents:
      - id: backend
        ref: agents/backend.yaml
      - id: comms
        ref: agents/comms.yaml
      - id: db
        ref: agents/db.yaml
      - id: sre
        ref: agents/sre.yaml
      - id: telemetry
        ref: agents/telemetry.yaml
      - id: verifier
        ref: agents/verifier.yaml
  workflow:
    entry: sre
    nodes:
      - id: backend
        role: specialist
      - id: comms
        role: specialist
      - id: db
        role: specialist
      - id: sre
        role: specialist
        delegates_to:
          - telemetry
          - backend
          - db
          - comms
          - verifier
      - id: telemetry
        role: specialist
      - id: verifier
        role: specialist
