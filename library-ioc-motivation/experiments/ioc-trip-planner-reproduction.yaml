experiment:
  name: ioc-trip-planner-reproduction
  description: Baseline + DR-1/DC-2/CC-3/CR-1 overlays on trip-planner-ioc over the README seed query, N reps. Produces
    the traces the ioc-trip-cognitive-eval pipeline scores.
  applications:
    - manifest: apps/trip-planner-ioc/mas.yaml
  scenarios:
    - id: baseline
      tags: []
      overlays:
        logic:
          - ref: overlays/baseline.yaml
        control: []
        infra: []
    - id: DR-1-semantic-affordable
      tags: []
      overlays:
        logic:
          - ref: apps/trip-planner-ioc/overlays/DR-1-semantic-affordable-attractions-mismatch.yaml
        control: []
        infra: []
    - id: DC-2-under-reading
      tags: []
      overlays:
        logic:
          - ref: apps/trip-planner-ioc/overlays/DC-2-UR-under-reading-trip-planner.yaml
        control: []
        infra: []
    - id: CC-3-missing-consensus
      tags: []
      overlays:
        logic:
          - ref: apps/trip-planner-ioc/overlays/CC-3-missing-consensus-protocol.yaml
        control: []
        infra: []
    - id: CR-1-divergent-goal
      tags: []
      overlays:
        logic:
          - ref: apps/trip-planner-ioc/overlays/CR-1-divergent-goal.yaml
        control: []
        infra: []
  dataset:
    path: datasets/trip-planner-queries.yaml
  run:
    n_runs: 20
  execution:
    parallel_scenarios: 3
    timeout: 300
    pause_between_runs: 1
    strategy: coverage
    emulation:
      infra:
        llm: live
        tools: live
      runtime:
        cache: content-addressed
